<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤 놀이 뽑기</title>
    <link rel="stylesheet" crossorigin as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #161622;
    --red: #e63946;
    --red-glow: rgba(230, 57, 70, 0.4);
    --blue: #4361ee;
    --blue-glow: rgba(67, 97, 238, 0.4);
    --cyan: #4cc9f0;
    --text: #eaeaea;
    --text-dim: #888;
    --border: rgba(255,255,255,0.06);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ── Animated background ── */
  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background:
      radial-gradient(ellipse 600px 600px at 20% 30%, rgba(230,57,70,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 500px 500px at 80% 70%, rgba(67,97,238,0.07) 0%, transparent 70%);
    animation: bgDrift 20s ease-in-out infinite alternate;
    z-index: 0;
    pointer-events: none;
  }
  @keyframes bgDrift {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-40px, 30px) rotate(3deg); }
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 60px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .header h1 {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: clamp(2rem, 6vw, 3rem);
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--red), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    position: relative;
    display: inline-block;
  }
  .header h1::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 10%; right: 10%;
    height: 3px;
    background: linear-gradient(90deg, var(--red), var(--blue));
    border-radius: 2px;
  }
  .header p {
    color: var(--text-dim);
    margin-top: 14px;
    font-size: 0.95rem;
  }

  /* ── Cards grid ── */
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 32px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
    cursor: default;
    transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    animation: cardIn 0.5s ease both;
  }
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.10s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.20s; }
  .card:nth-child(5) { animation-delay: 0.25s; }
  .card:nth-child(6) { animation-delay: 0.30s; }

  @keyframes cardIn {
    0% { opacity: 0; transform: translateY(24px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.12);
  }
  .card.red-accent { box-shadow: 0 0 0 1px rgba(230,57,70,0.15); }
  .card.blue-accent { box-shadow: 0 0 0 1px rgba(67,97,238,0.15); }
  .card.red-accent:hover { box-shadow: 0 8px 30px var(--red-glow); border-color: rgba(230,57,70,0.3); }
  .card.blue-accent:hover { box-shadow: 0 8px 30px var(--blue-glow); border-color: rgba(67,97,238,0.3); }

  .card .icon {
    font-size: 2rem;
    margin-bottom: 10px;
    display: block;
  }
  .card .label {
    font-weight: 700;
    font-size: 0.95rem;
    line-height: 1.4;
  }
  .card .delete-btn {
    position: absolute;
    top: 8px; right: 8px;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.06);
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s, background 0.2s, color 0.2s;
  }
  .card:hover .delete-btn { opacity: 1; }
  .card .delete-btn:hover { background: var(--red); color: #fff; }

  /* ── Add card ── */
  .add-area {
    display: flex;
    gap: 10px;
    margin-bottom: 32px;
  }
  .add-area input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    color: var(--text);
    font-size: 0.95rem;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .add-area input::placeholder { color: var(--text-dim); }
  .add-area input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(67,97,238,0.15);
  }
  .add-area button {
    background: linear-gradient(135deg, var(--blue), var(--red));
    border: none;
    border-radius: 12px;
    padding: 14px 22px;
    color: #fff;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .add-area button:hover {
    transform: scale(1.04);
    box-shadow: 0 4px 20px rgba(230,57,70,0.3);
  }
  .add-area button:active { transform: scale(0.97); }

  /* ── Spin button ── */
  .spin-btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 16px;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 1.4rem;
    letter-spacing: 2px;
    color: #fff;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, var(--red), #c1121f, var(--blue));
    background-size: 200% 200%;
    animation: gradientShift 4s ease infinite;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 24px var(--red-glow);
    margin-bottom: 40px;
  }
  @keyframes gradientShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .spin-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 36px var(--red-glow), 0 8px 36px var(--blue-glow);
  }
  .spin-btn:active { transform: scale(0.97); }
  .spin-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ── Result overlay ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .overlay.active { opacity: 1; pointer-events: all; }

  .result-card {
    background: var(--surface);
    border: 2px solid transparent;
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    transform: scale(0.8) rotateX(15deg);
    transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1), border-color 0.5s;
    position: relative;
  }
  .overlay.active .result-card {
    transform: scale(1) rotateX(0);
    border-color: var(--red);
    box-shadow: 0 0 60px var(--red-glow), 0 0 60px var(--blue-glow);
  }
  .result-card .emoji { font-size: 4rem; margin-bottom: 16px; display: block; }
  .result-card .title {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 1.1rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-bottom: 12px;
  }
  .result-card .name {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    background: linear-gradient(135deg, var(--red), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 32px;
  }
  .result-card .close-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 36px;
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .result-card .close-btn:hover { background: rgba(255,255,255,0.14); }

  /* ── Roulette animation ── */
  .roulette-text {
    display: none;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    text-align: center;
    padding: 24px;
    color: var(--text);
    min-height: 90px;
    margin-bottom: 16px;
  }
  .roulette-text.active { display: flex; align-items: center; justify-content: center; }

  /* ── Footer ── */
  .footer {
    margin-top: auto;
    text-align: center;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .footer a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 1px;
    transition: color 0.3s;
    position: relative;
    padding-bottom: 2px;
  }
  .footer a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--red), var(--blue));
    transform: scaleX(0);
    transition: transform 0.3s;
  }
  .footer a:hover { color: var(--text); }
  .footer a:hover::after { transform: scaleX(1); }

  /* ── Confetti ── */
  .confetti-piece {
    position: fixed;
    width: 8px;
    height: 8px;
    z-index: 200;
    pointer-events: none;
    border-radius: 2px;
  }

  @media (max-width: 440px) {
    .cards { grid-template-columns: 1fr; }
    .app { padding: 24px 16px 48px; }
  }

  /* ── 홈으로 돌아가기 버튼 (공통) ── */
  .home-link {
    display: inline-block;
    margin-top: 40px;
    color: #6e6e85;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 1px;
    transition: color 0.3s, border-color 0.3s;
    padding: 8px 16px;
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
  }
  .home-link:hover {
    color: #4895ef;
    border-color: rgba(72, 149, 239, 0.15);
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>🎰 랜덤 놀이 뽑기</h1>
    <p>카드를 추가하고, 버튼을 눌러 랜덤 뽑기!</p>
  </div>

  <div class="cards" id="cardGrid"></div>

  <div class="add-area">
    <input type="text" id="newGame" placeholder="새 게임을 입력하세요..." maxlength="30">
    <button onclick="addCard()">+ 추가</button>
  </div>

  <div class="roulette-text" id="roulette"></div>

  <button class="spin-btn" id="spinBtn" onclick="spin()">🎲 뽑 기 🎲</button>

  <div class="footer">
    <a href="../index.html" class="home-link">← 홈으로 돌아가기</a>
  </div>
</div>

<!-- Result overlay -->
<div class="overlay" id="overlay" onclick="closeResult(event)">
  <div class="result-card">
    <span class="emoji" id="resultEmoji">🎉</span>
    <div class="title">당첨</div>
    <div class="name" id="resultName"></div>
    <button class="close-btn" onclick="closeOverlay()">확인</button>
  </div>
</div>

<script>
const ICONS = ['🎮','💪','🏋️','🦵','🧘','⚡','🔥','🎯','🏃','🤸','🎲','🃏','✨','💥','🌟'];
const COLORS = ['red-accent','blue-accent'];

let games = [
  { name: '원하는 게임', icon: '🎮' },
  { name: '팔굽혀펴기 20회', icon: '🏃' },
  { name: '스쿼트 20회', icon: '🏃' },
  { name: '플랭크 1분', icon: '🏃' },
];

function render() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  games.forEach((g, i) => {
    const div = document.createElement('div');
    div.className = `card ${COLORS[i % 2]}`;
    div.style.animationDelay = `${i * 0.05}s`;
    div.innerHTML = `
      <button class="delete-btn" onclick="removeCard(${i})" title="삭제">✕</button>
      <span class="icon">${g.icon}</span>
      <span class="label">${g.name}</span>
    `;
    grid.appendChild(div);
  });
  document.getElementById('spinBtn').disabled = games.length < 2;
}

function addCard() {
  const input = document.getElementById('newGame');
  const name = input.value.trim();
  if (!name) return;
  const icon = '🎲';
  games.push({ name, icon });
  input.value = '';
  render();
}

document.getElementById('newGame').addEventListener('keydown', e => {
  if (e.key === 'Enter') addCard();
});

function removeCard(idx) {
  games.splice(idx, 1);
  render();
}

// ── Sound Effects (Web Audio API) ──
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playTick(pitch = 800) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.value = pitch;
  gain.gain.setValueAtTime(0.08, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
  osc.connect(gain).connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.06);
}

function playDrumroll() {
  const ctx = getAudioCtx();
  const duration = 0.08;
  for (let i = 0; i < 30; i++) {
    const t = ctx.currentTime + i * 0.03;
    const noise = ctx.createBufferSource();
    const buf = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let j = 0; j < data.length; j++) data[j] = (Math.random() * 2 - 1) * 0.15;
    noise.buffer = buf;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.04 + i * 0.004, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 200; filter.Q.value = 1;
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(t); noise.stop(t + duration);
  }
}

function playFanfare() {
  const ctx = getAudioCtx();
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    const t = ctx.currentTime + i * 0.12;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.4);
  });
  // bass boom
  setTimeout(() => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 80;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.5);
  }, 480);
}

function spin() {
  if (games.length < 2) return;
  const btn = document.getElementById('spinBtn');
  const roulette = document.getElementById('roulette');
  btn.disabled = true;
  roulette.classList.add('active');

  // screen shake class
  document.body.style.overflow = 'hidden';

  playDrumroll();

  let count = 0;
  const total = 15 + Math.floor(Math.random() * 6);
  let delay = 40;
  let lastIdx = -1;

  // flash effect on cards
  const cards = document.querySelectorAll('.card');

  function tick() {
    let idx;
    do { idx = Math.floor(Math.random() * games.length); } while (idx === lastIdx && games.length > 1);
    lastIdx = idx;

    roulette.textContent = `${games[idx].icon} ${games[idx].name}`;

    // highlight matching card
    cards.forEach((c, ci) => {
      c.style.transform = ci === idx ? 'scale(1.08)' : 'scale(0.95)';
      c.style.opacity = ci === idx ? '1' : '0.4';
      c.style.borderColor = ci === idx ? (ci % 2 === 0 ? 'var(--red)' : 'var(--blue)') : 'var(--border)';
      c.style.boxShadow = ci === idx ? (ci % 2 === 0 ? '0 0 25px var(--red-glow)' : '0 0 25px var(--blue-glow)') : 'none';
    });

    // roulette text color flash
    const progress = count / total;
    const hue = progress < 0.7 ? 230 : 0;
    roulette.style.color = `hsl(${hue}, 80%, ${60 + Math.sin(count) * 15}%)`;
    roulette.style.transform = `scale(${1 + Math.sin(count * 0.5) * 0.08})`;
    roulette.style.textShadow = progress > 0.6 
      ? `0 0 ${20 + progress * 30}px var(--red-glow), 0 0 ${10 + progress * 20}px var(--blue-glow)` 
      : 'none';

    // pitch increases as we slow down
    const pitch = 400 + progress * 800;
    playTick(pitch);

    // screen shake near the end
    if (progress > 0.7) {
      const intensity = (progress - 0.7) * 15;
      document.body.style.transform = `translate(${(Math.random()-0.5)*intensity}px, ${(Math.random()-0.5)*intensity}px)`;
    }

    count++;
    if (count < total) {
      delay += count * 3;
      setTimeout(tick, delay);
    } else {
      // FINAL — dramatic pause then reveal
      roulette.style.color = 'var(--text)';
      roulette.style.textShadow = 'none';

      // suspense blink
      let blinks = 0;
      const blinkInterval = setInterval(() => {
        roulette.style.opacity = roulette.style.opacity === '0.2' ? '1' : '0.2';
        blinks++;
        if (blinks >= 6) {
          clearInterval(blinkInterval);
          roulette.style.opacity = '1';

          // pick winner
          const winner = games[Math.floor(Math.random() * games.length)];
          roulette.textContent = `${winner.icon} ${winner.name}`;
          roulette.style.transform = 'scale(1.2)';
          roulette.style.textShadow = '0 0 40px var(--red-glow), 0 0 60px var(--blue-glow)';

          // reset card styles
          cards.forEach(c => {
            c.style.transform = '';
            c.style.opacity = '';
            c.style.borderColor = '';
            c.style.boxShadow = '';
          });
          document.body.style.transform = '';
          document.body.style.overflow = '';

          playFanfare();

          setTimeout(() => {
            roulette.classList.remove('active');
            roulette.style.transform = '';
            roulette.style.textShadow = '';
            showResult(winner);
            btn.disabled = false;
          }, 800);
        }
      }, 120);
    }
  }
  tick();
}

function showResult(winner) {
  document.getElementById('resultEmoji').textContent = winner.icon;
  document.getElementById('resultName').textContent = winner.name;
  document.getElementById('overlay').classList.add('active');
  confetti();
}

function closeResult(e) {
  if (e.target === e.currentTarget) closeOverlay();
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('active');
}

function confetti() {
  const colors = ['#e63946','#4361ee','#4cc9f0','#f72585','#7209b5','#fff'];
  for (let i = 0; i < 50; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.left = `${Math.random() * 100}vw`;
    el.style.top = '-10px';
    el.style.opacity = Math.random() * 0.8 + 0.2;
    el.style.width = `${Math.random() * 6 + 4}px`;
    el.style.height = `${Math.random() * 10 + 4}px`;
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(el);

    const xDrift = (Math.random() - 0.5) * 200;
    const duration = Math.random() * 1500 + 1500;
    el.animate([
      { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
      { transform: `translate(${xDrift}px, ${window.innerHeight + 20}px) rotate(${Math.random()*720}deg)`, opacity: 0 }
    ], { duration, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)' })
    .onfinish = () => el.remove();
  }
}

render();
</script>
</body>
</html>
