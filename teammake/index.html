<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TKGDQZKW20"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-TKGDQZKW20');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 나누기</title>
    <link rel="stylesheet" crossorigin as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0a0a0f;
        color: #ffffff;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* 배경 파티클 */
      .bg-particles {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 0;
        background:
          radial-gradient(ellipse at 20% 50%, rgba(220, 40, 40, 0.08) 0%, transparent 60%),
          radial-gradient(ellipse at 80% 50%, rgba(30, 100, 220, 0.08) 0%, transparent 60%),
          radial-gradient(ellipse at 50% 0%, rgba(100, 50, 150, 0.05) 0%, transparent 50%);
      }

      .container {
        position: relative; z-index: 1;
        max-width: 1200px; margin: 0 auto; padding: 20px;
        min-height: 100vh; display: flex; flex-direction: column;
      }

      /* ===== 헤더 ===== */
      .header {
        text-align: center; padding: 30px 0 10px;
      }
      .header h1 {
        font-size: 3rem; font-weight: 900; letter-spacing: 4px;
        background: linear-gradient(135deg, #ff4444, #ffffff 50%, #4488ff);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text; text-shadow: none;
        animation: titlePulse 3s ease-in-out infinite;
      }
      @keyframes titlePulse {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.3); }
      }
      .header .subtitle {
        margin-top: 8px; font-size: 0.95rem; color: #666;
        letter-spacing: 6px; text-transform: uppercase;
      }

      /* ===== 시작 화면 ===== */
      #startScreen {
        flex: 1; display: flex; flex-direction: column;
        justify-content: center; align-items: center; gap: 40px;
      }

      .input-section {
        text-align: center;
      }
      .input-section label {
        display: block; font-size: 1.1rem; color: #aaa;
        margin-bottom: 18px; letter-spacing: 2px;
      }

      .number-control {
        display: flex; align-items: center; gap: 0;
        background: #14141f; border-radius: 20px; overflow: hidden;
        border: 2px solid #222;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
      }
      .number-control button {
        width: 70px; height: 80px; border: none; cursor: pointer;
        font-size: 2rem; font-weight: 700; transition: all 0.2s;
        display: flex; align-items: center; justify-content: center;
      }
      .btn-minus {
        background: linear-gradient(135deg, #cc2222, #881111);
        color: #fff;
      }
      .btn-minus:hover { background: linear-gradient(135deg, #ee3333, #aa2222); }
      .btn-minus:active { transform: scale(0.95); }

      .btn-plus {
        background: linear-gradient(135deg, #2255cc, #113388);
        color: #fff;
      }
      .btn-plus:hover { background: linear-gradient(135deg, #3366ee, #2244aa); }
      .btn-plus:active { transform: scale(0.95); }

      .number-display {
        width: 120px; height: 80px; display: flex; align-items: center;
        justify-content: center; font-size: 2.8rem; font-weight: 900;
        color: #fff; background: #14141f;
        border-left: 1px solid #222; border-right: 1px solid #222;
      }

      /* 팀 수 선택 */
      .team-count-section {
        text-align: center;
      }
      .team-count-section label {
        display: block; font-size: 1.1rem; color: #aaa;
        margin-bottom: 18px; letter-spacing: 2px;
      }
      .team-buttons {
        display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
      }
      .team-btn {
        width: 56px; height: 56px; border-radius: 14px; border: 2px solid #333;
        background: #14141f; color: #888; font-size: 1.3rem; font-weight: 700;
        cursor: pointer; transition: all 0.25s;
      }
      .team-btn.active {
        border-color: #ff4444;
        background: linear-gradient(135deg, #331111, #1a0a0a);
        color: #ff6666;
        box-shadow: 0 0 20px rgba(255,50,50,0.2);
      }
      .team-btn:hover { border-color: #555; color: #ccc; }

      /* 시작 버튼 */
      .start-btn {
        padding: 18px 70px; border: none; border-radius: 16px; cursor: pointer;
        font-size: 1.3rem; font-weight: 700; letter-spacing: 4px;
        background: linear-gradient(135deg, #cc2222, #2244aa);
        color: #fff; position: relative; overflow: hidden;
        transition: all 0.3s; box-shadow: 0 4px 30px rgba(150,30,30,0.3);
      }
      .start-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 40px rgba(150,30,30,0.5);
      }
      .start-btn:active { transform: translateY(0) scale(0.98); }
      .start-btn::after {
        content: ''; position: absolute; top: -50%; left: -50%;
        width: 200%; height: 200%;
        background: linear-gradient(transparent, rgba(255,255,255,0.05), transparent);
        transform: rotate(45deg); animation: shimmer 3s infinite;
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%) rotate(45deg); }
        100% { transform: translateX(100%) rotate(45deg); }
      }

      /* ===== 결과 화면 ===== */
      #resultScreen { display: none; flex: 1; }

      .result-header {
        text-align: center; margin: 20px 0 30px;
      }
      .result-header h2 {
        font-size: 1.5rem; color: #888; font-weight: 400;
        letter-spacing: 3px;
      }

      .teams-container {
        display: grid; gap: 24px;
        grid-template-columns: repeat(2, 1fr);
        margin-bottom: 30px;
      }

      .team-card {
        background: #111118; border-radius: 20px; padding: 24px;
        border: 1px solid #222; position: relative; overflow: hidden;
        transition: transform 0.3s;
      }
      .team-card:hover { transform: translateY(-3px); }

      .team-card.red {
        border-color: rgba(220, 50, 50, 0.3);
        box-shadow: 0 0 40px rgba(200, 30, 30, 0.08);
      }
      .team-card.red::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, #cc2222, #ff6644);
      }
      .team-card.blue {
        border-color: rgba(50, 100, 220, 0.3);
        box-shadow: 0 0 40px rgba(30, 80, 200, 0.08);
      }
      .team-card.blue::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, #2244cc, #44aaff);
      }

      .team-title {
        font-size: 1.3rem; font-weight: 700; margin-bottom: 20px;
        display: flex; align-items: center; gap: 10px;
      }
      .team-card.red .team-title { color: #ff5555; }
      .team-card.blue .team-title { color: #5599ff; }

      .team-badge {
        display: inline-flex; align-items: center; justify-content: center;
        width: 32px; height: 32px; border-radius: 8px; font-size: 0.8rem;
        font-weight: 900;
      }
      .team-card.red .team-badge { background: rgba(200,30,30,0.2); color: #ff5555; }
      .team-card.blue .team-badge { background: rgba(30,80,200,0.2); color: #5599ff; }

      .members-grid {
        display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
      }

      /* ===== 티셔츠 아이콘 ===== */
      .member-item {
        display: flex; flex-direction: column; align-items: center; gap: 4px;
        animation: memberPop 0.4s ease-out both;
      }
      @keyframes memberPop {
        0% { opacity: 0; transform: scale(0.3) translateY(20px); }
        70% { transform: scale(1.1) translateY(-3px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }

      .tshirt-container {
        position: relative; width: 68px; height: 72px;
        cursor: pointer; transition: transform 0.2s;
      }
      .tshirt-container:hover { transform: scale(1.15) rotate(-3deg); }

      .tshirt-svg { width: 100%; height: 100%; }

      .tshirt-number {
        position: absolute; top: 52%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.15rem; font-weight: 900; color: #fff;
        text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        pointer-events: none;
      }

      .member-label {
        font-size: 0.7rem; color: #666; letter-spacing: 1px;
      }

      /* ===== 셔플 애니메이션 ===== */
      .shuffle-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(5, 5, 10, 0.95); z-index: 100;
        justify-content: center; align-items: center; flex-direction: column; gap: 30px;
      }
      .shuffle-overlay.active { display: flex; }
      .shuffle-text {
        font-size: 2rem; font-weight: 900; letter-spacing: 6px;
        background: linear-gradient(135deg, #ff4444, #4488ff);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        animation: shufflePulse 0.5s ease-in-out infinite alternate;
      }
      @keyframes shufflePulse {
        0% { transform: scale(1); }
        100% { transform: scale(1.05); }
      }
      .shuffle-cards {
        display: flex; gap: 10px;
      }
      .shuffle-card {
        width: 40px; height: 55px; border-radius: 8px;
        animation: cardShuffle 0.6s ease-in-out infinite alternate;
      }
      .shuffle-card:nth-child(odd) { background: linear-gradient(135deg, #cc2222, #ff4444); }
      .shuffle-card:nth-child(even) { background: linear-gradient(135deg, #2244cc, #4488ff); }
      .shuffle-card:nth-child(1) { animation-delay: 0s; }
      .shuffle-card:nth-child(2) { animation-delay: 0.1s; }
      .shuffle-card:nth-child(3) { animation-delay: 0.2s; }
      .shuffle-card:nth-child(4) { animation-delay: 0.3s; }
      .shuffle-card:nth-child(5) { animation-delay: 0.4s; }
      @keyframes cardShuffle {
        0% { transform: translateY(-15px) rotate(-5deg); }
        100% { transform: translateY(15px) rotate(5deg); }
      }

      /* ===== 다시하기 / 홈 버튼 ===== */
      .action-buttons {
        display: flex; justify-content: center; gap: 16px;
        margin: 20px 0;
      }
      .reshuffle-btn {
        padding: 14px 40px; border: 2px solid #333; border-radius: 12px;
        background: transparent; color: #aaa; font-size: 1rem;
        font-weight: 700; cursor: pointer; letter-spacing: 2px;
        transition: all 0.3s; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .reshuffle-btn:hover {
        border-color: #ff4444; color: #ff6666;
        box-shadow: 0 0 20px rgba(255,50,50,0.15);
      }

      /* ===== 하단 홈 ===== */
      .footer {
        text-align: center; padding: 30px 0 20px;
        margin-top: auto;
      }
      .footer a {
        color: #444; text-decoration: none; font-size: 0.9rem;
        letter-spacing: 3px; transition: color 0.3s;
        cursor: pointer;
      }
      .footer a:hover { color: #aaa; }

      /* 반응형 */
      @media (max-width: 768px) {
        .header h1 { font-size: 2rem; }
        .teams-container { grid-template-columns: 1fr; }
        .number-control button { width: 60px; height: 65px; font-size: 1.6rem; }
        .number-display { width: 90px; height: 65px; font-size: 2.2rem; }
        .tshirt-container { width: 56px; height: 60px; }
        .tshirt-number { font-size: 0.95rem; }
      }
    </style>
</head>
<body>

<div class="bg-particles"></div>

<div class="shuffle-overlay" id="shuffleOverlay">
  <div class="shuffle-cards">
    <div class="shuffle-card"></div>
    <div class="shuffle-card"></div>
    <div class="shuffle-card"></div>
    <div class="shuffle-card"></div>
    <div class="shuffle-card"></div>
  </div>
  <div class="shuffle-text">팀 배정 중...</div>
</div>

<div class="container">

  <div class="header">
    <h1>⚡ 팀 나누기 ⚡</h1>
    <div class="subtitle">Team Shuffle</div>
  </div>

  <div id="startScreen">

    <div class="input-section">
      <label>👥 참가 인원수</label>
      <div class="number-control">
        <button class="btn-minus" onclick="adjustCount(-1)">−</button>
        <div class="number-display" id="studentCount">20</div>
        <button class="btn-plus" onclick="adjustCount(1)">+</button>
      </div>
    </div>

    <div class="team-count-section">
      <label>🏆 팀 개수</label>
      <div class="team-buttons" id="teamButtons">
        <button class="team-btn" data-teams="2" onclick="setTeams(2)">2</button>
        <button class="team-btn active" data-teams="4" onclick="setTeams(4)">4</button>
        <button class="team-btn" data-teams="5" onclick="setTeams(5)">5</button>
        <button class="team-btn" data-teams="6" onclick="setTeams(6)">6</button>
        <button class="team-btn" data-teams="8" onclick="setTeams(8)">8</button>
        <button class="team-btn" data-teams="10" onclick="setTeams(10)">10</button>
      </div>
    </div>

    <button class="start-btn" onclick="startShuffle()">팀 배정 시작</button>
  </div>

  <div id="resultScreen">
    <div class="result-header">
      <h2 id="resultInfo"></h2>
    </div>
    <div class="teams-container" id="teamsContainer"></div>
    <div class="action-buttons">
      <button class="reshuffle-btn" onclick="startShuffle()">🔄 다시 섞기</button>
    </div>
  </div>

  <div class="footer">
    <a onclick="goHome()">↩ 홈으로 돌아가기</a>
  </div>

</div>

<audio id="bgmAudio" loop preload="auto" src="https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3"></audio>
<audio id="clickAudio" preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-modern-click-box-check-1120.mp3"></audio>
<audio id="shuffleAudio" preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-slot-machine-win-alert-1931.mp3"></audio>
<audio id="resultAudio" preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3"></audio>

<script>
  let studentCount = 20;
  let teamCount = 4;

  // ===== 오디오 제어 로직 =====
  const bgmAudio = document.getElementById('bgmAudio');
  bgmAudio.volume = 0.15; // 배경음악이 방해되지 않도록 볼륨을 낮춰두었어요
  const clickAudio = document.getElementById('clickAudio');
  const shuffleAudio = document.getElementById('shuffleAudio');
  const resultAudio = document.getElementById('resultAudio');

  let isBgmPlaying = false;
  // 사용자가 화면의 어느 곳이든 처음 클릭하면 음악이 시작되도록 부드럽게 연결해 두었어요
  document.body.addEventListener('click', () => {
    if (!isBgmPlaying) {
      bgmAudio.play().catch(() => {});
      isBgmPlaying = true;
    }
  }, { once: true });

  function playClick() {
    clickAudio.currentTime = 0;
    clickAudio.play().catch(() => {});
  }

  // 인원 조절
  function adjustCount(delta) {
    playClick(); // 클릭할 때마다 작은 타격감이 느껴질 거예요
    studentCount = Math.min(100, Math.max(2, studentCount + delta));
    document.getElementById('studentCount').textContent = studentCount;
  }

  // 팀 수 선택
  function setTeams(n) {
    playClick(); // 버튼을 누를 때도 소리가 나도록 덧입혔어요
    teamCount = n;
    document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('active'));
    const target = document.querySelector(`.team-btn[data-teams="${n}"]`);
    if(target) target.classList.add('active');
  }

  // 티셔츠 SVG 생성
  function createTshirtSVG(color) {
    const isRed = color === 'red';
    const main = isRed ? '#cc2222' : '#2255cc';
    const light = isRed ? '#ee4444' : '#4488ff';
    const dark = isRed ? '#881515' : '#1a3d8a';
    const collar = isRed ? '#aa1a1a' : '#1a44aa';

    return `
      <svg viewBox="0 0 100 110" class="tshirt-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad_${color}_${Math.random().toString(36).substr(2,5)}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:${light};stop-opacity:1" />
            <stop offset="100%" style="stop-color:${dark};stop-opacity:1" />
          </linearGradient>
        </defs>
        <path d="M25,30 L25,100 Q25,105 30,105 L70,105 Q75,105 75,100 L75,30"
              fill="${main}" stroke="${dark}" stroke-width="1.2"/>
        <path d="M25,30 L5,42 Q2,44 4,47 L14,55 Q16,57 18,55 L25,46 Z"
              fill="${light}" stroke="${dark}" stroke-width="1"/>
        <path d="M75,30 L95,42 Q98,44 96,47 L86,55 Q84,57 82,55 L75,46 Z"
              fill="${light}" stroke="${dark}" stroke-width="1"/>
        <path d="M25,30 Q50,18 75,30" fill="${main}" stroke="${dark}" stroke-width="1"/>
        <path d="M38,24 Q50,35 62,24 Q50,18 38,24 Z"
              fill="${collar}" stroke="${dark}" stroke-width="0.8"/>
        <path d="M30,35 L30,95" stroke="rgba(255,255,255,0.08)" stroke-width="8" stroke-linecap="round"/>
      </svg>`;
  }

  // 셔플 시작
  function startShuffle() {
    playClick();
    const overlay = document.getElementById('shuffleOverlay');
    overlay.classList.add('active');
    
    // 섞이는 동안 긴장감 있는 효과음이 재생됩니다
    shuffleAudio.currentTime = 0;
    shuffleAudio.play().catch(() => {});

    setTimeout(() => {
      overlay.classList.remove('active');
      generateTeams();
    }, 1500);
  }

  // 팀 생성
  function generateTeams() {
    shuffleAudio.pause(); // 섞이는 소리를 멈추고
    resultAudio.currentTime = 0;
    resultAudio.play().catch(() => {}); // 짜잔! 하는 결과음이 울리게 했어요

    document.getElementById('startScreen').style.display = 'none';
    const resultScreen = document.getElementById('resultScreen');
    resultScreen.style.display = 'block';

    // 학생 배열 셔플
    let students = Array.from({length: studentCount}, (_, i) => i + 1);
    for (let i = students.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [students[i], students[j]] = [students[j], students[i]];
    }

    // 팀 분배
    let teams = Array.from({length: teamCount}, () => []);
    students.forEach((s, idx) => {
      teams[idx % teamCount].push(s);
    });

    // 결과 정보
    const perTeam = Math.floor(studentCount / teamCount);
    const extra = studentCount % teamCount;
    document.getElementById('resultInfo').textContent =
      `${studentCount}명 → ${teamCount}팀 (팀당 ${perTeam}${extra ? '~' + (perTeam + 1) : ''}명)`;

    const container = document.getElementById('teamsContainer');
    // 팀 카드 생성
    const teamNames = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
    const teamEmojis = ['🔴', '🔵', '🔴', '🔵', '🔴', '🔵', '🔴', '🔵', '🔴', '🔵'];

    container.innerHTML = '';

    teams.forEach((members, idx) => {
      const colorClass = idx % 2 === 0 ? 'red' : 'blue';
      const card = document.createElement('div');
      card.className = `team-card ${colorClass}`;

      let membersHTML = '';
      members.sort((a, b) => a - b).forEach((num, mIdx) => {
        const delay = (idx * 0.08 + mIdx * 0.06).toFixed(2);
        membersHTML += `
          <div class="member-item" style="animation-delay: ${delay}s">
            <div class="tshirt-container">
              ${createTshirtSVG(colorClass)}
              <div class="tshirt-number">${num}</div>
            </div>
            <div class="member-label">${num}번</div>
          </div>`;
      });

      card.innerHTML = `
        <div class="team-title">
          <span class="team-badge">${teamNames[idx]}</span>
          ${teamEmojis[idx]} TEAM ${teamNames[idx]}
          <span style="margin-left:auto;font-size:0.85rem;color:#555;font-weight:400">${members.length}명</span>
        </div>
        <div class="members-grid">${membersHTML}</div>`;

      container.appendChild(card);
    });
  }

  // 홈으로
  function goHome() {
    playClick(); // 떠날 때도 가볍게 소리가 나도록
    setTimeout(() => {
      window.location.href = '../index.html'; // 요청하신 대로 index.html로 수정되었습니다!
    }, 150);
  }

  // 길게 누르면 빠른 조절
  let holdTimer = null;
  let holdSpeed = 200;
  
  const minusBtn = document.querySelector('.btn-minus');
  const plusBtn = document.querySelector('.btn-plus');

  const startHold = (delta) => {
      holdTimer = setInterval(() => adjustCount(delta), holdSpeed);
  };
  const endHold = () => {
      clearInterval(holdTimer);
  };

  minusBtn.addEventListener('mousedown', () => { startHold(-1); });
  plusBtn.addEventListener('mousedown', () => { startHold(1); });
  
  window.addEventListener('mouseup', endHold);
  window.addEventListener('mouseleave', endHold);
</script>

</body>
</html>
