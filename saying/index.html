<title>오늘의 명언</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a10;
  --surface:#12121e;
  --card:#16162a;
  --red:#e63946;
  --red-glow:rgba(230,57,70,.35);
  --blue:#4361ee;
  --blue-glow:rgba(67,97,238,.35);
  --cyan:#48cae4;
  --text:#e8e8f0;
  --dim:#6b6b8d;
}
html,body{height:100%;font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

/* ── ambient background ── */
body::before{
  content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at 30% 40%,var(--red-glow) 0%,transparent 45%),
             radial-gradient(circle at 70% 60%,var(--blue-glow) 0%,transparent 45%);
  animation:drift 20s ease-in-out infinite alternate;
  z-index:0;pointer-events:none;
}
@keyframes drift{
  0%{transform:translate(0,0) rotate(0deg)}
  100%{transform:translate(-5%,3%) rotate(8deg)}
}

/* ── wrapper ── */
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem}

/* ── particles (decorative) ── */
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;opacity:0;animation:float-up linear infinite}
@keyframes float-up{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:1}
  90%{opacity:.6}
  100%{transform:translateY(-10vh) scale(1);opacity:0}
}

/* ════════════════════════════════
   SCREEN: SETUP
   ════════════════════════════════ */
#setup-screen{text-align:center}
#setup-screen .logo{font-size:clamp(2rem,6vw,3.5rem);font-weight:900;letter-spacing:-.02em;margin-bottom:.3rem}
#setup-screen .logo span.red{color:var(--red)}
#setup-screen .logo span.blue{color:var(--blue)}
#setup-screen .sub{color:var(--dim);font-size:.95rem;margin-bottom:2.5rem;font-style:italic;font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;font-size:1.1rem}

.count-picker{display:flex;align-items:center;justify-content:center;gap:1.2rem;margin-bottom:1.8rem}
.count-picker button{
  width:48px;height:48px;border-radius:50%;border:2px solid var(--dim);
  background:transparent;color:var(--text);font-size:1.4rem;cursor:pointer;
  transition:all .25s;display:flex;align-items:center;justify-content:center;
}
.count-picker button:hover{border-color:var(--cyan);color:var(--cyan);transform:scale(1.1)}
.count-picker .count-display{
  font-size:3rem;font-weight:900;width:90px;text-align:center;
  background:linear-gradient(135deg,var(--red),var(--blue));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.count-label{color:var(--dim);font-size:.85rem;margin-bottom:2.5rem}

.start-btn{
  position:relative;padding:1rem 3rem;border:none;border-radius:60px;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;font-size:1.1rem;font-weight:700;
  color:#fff;cursor:pointer;overflow:hidden;
  background:linear-gradient(135deg,var(--red),var(--blue));
  box-shadow:0 0 30px var(--red-glow),0 0 60px var(--blue-glow);
  transition:transform .3s,box-shadow .3s;
}
.start-btn:hover{transform:scale(1.06);box-shadow:0 0 40px var(--red-glow),0 0 80px var(--blue-glow)}
.start-btn::after{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.15) 50%,transparent 60%);
  animation:shimmer 3s infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%) rotate(25deg)}100%{transform:translateX(100%) rotate(25deg)}}

/* ════════════════════════════════
   SCREEN: DRAW
   ════════════════════════════════ */
#draw-screen{display:none;text-align:center;width:100%;max-width:680px}
.progress{color:var(--dim);font-size:.9rem;margin-bottom:1.5rem;font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;font-size:1.05rem}
.progress span{color:var(--cyan);font-weight:700}

/* the card stack */
.card-stage{position:relative;width:100%;min-height:340px;display:flex;align-items:center;justify-content:center;perspective:1200px;margin-bottom:2rem}

/* draw prompt */
.draw-prompt{
  cursor:pointer;user-select:none;
  animation:pulse-glow 2.5s ease-in-out infinite;
}
.draw-prompt .orb{
  width:140px;height:140px;border-radius:50%;margin:0 auto 1.2rem;
  background:radial-gradient(circle at 35% 35%,var(--blue),var(--red));
  box-shadow:0 0 50px var(--red-glow),0 0 80px var(--blue-glow);
  display:flex;align-items:center;justify-content:center;
  font-size:2.8rem;transition:transform .4s;
}
.draw-prompt:hover .orb{transform:scale(1.1) rotate(10deg)}
.draw-prompt p{color:var(--dim);font-size:.95rem}
@keyframes pulse-glow{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.25)}
}

/* revealed card */
.quote-card{
  position:absolute;top:0;left:50%;width:90%;max-width:580px;
  transform:translateX(-50%);
  background:var(--card);
  border:1px solid rgba(255,255,255,.06);
  border-radius:20px;padding:2.5rem 2rem 2rem;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;
}
/* entrance animation */
.quote-card.reveal{
  animation:card-emerge .9s cubic-bezier(.16,1,.3,1) forwards;
  pointer-events:auto;
}
@keyframes card-emerge{
  0%{opacity:0;transform:translateX(-50%) translateY(60px) scale(.85) rotateX(15deg);filter:blur(8px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1) rotateX(0);filter:blur(0)}
}
.quote-card .card-number{
  position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--red),var(--blue));
  color:#fff;font-weight:900;font-size:.8rem;
  padding:.35rem 1rem;border-radius:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.4);
}
.quote-card .quote-text{
  font-size:clamp(1rem,3vw,1.25rem);line-height:1.9;
  margin-bottom:1rem;word-break:keep-all;
}
.quote-card .quote-text::before{
  content:'"';font-size:3rem;font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  color:var(--red);opacity:.5;line-height:0;vertical-align:-.6rem;margin-right:.2rem;
}
.quote-card .quote-text::after{
  content:'"';font-size:3rem;font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  color:var(--blue);opacity:.5;line-height:0;vertical-align:-.6rem;margin-left:.2rem;
}
.quote-card .quote-author{
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;font-style:italic;
  color:var(--cyan);font-size:1rem;
}
.quote-card .divider{
  width:50px;height:2px;margin:1rem auto;
  background:linear-gradient(90deg,var(--red),var(--blue));border-radius:2px;
}

/* stacked old cards */
.quote-card.stacked{
  animation:none;opacity:1;
  transition:all .5s cubic-bezier(.16,1,.3,1);
}

/* ── controls ── */
.controls{margin-top:1rem;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.ctrl-btn{
  padding:.7rem 1.8rem;border-radius:40px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);color:var(--text);font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size:.9rem;cursor:pointer;transition:all .25s;
}
.ctrl-btn:hover{background:rgba(255,255,255,.1);border-color:var(--cyan);color:var(--cyan)}

/* ════════════════════════════════
   SCREEN: RESULT (all done)
   ════════════════════════════════ */
#result-screen{display:none;text-align:center;width:100%;max-width:680px}
.result-title{font-size:1.6rem;font-weight:900;margin-bottom:2rem}
.result-title span{background:linear-gradient(135deg,var(--red),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-list{display:flex;flex-direction:column;gap:1.2rem;margin-bottom:2rem}
.result-item{
  background:var(--card);border:1px solid rgba(255,255,255,.06);
  border-radius:16px;padding:1.5rem 1.5rem 1.2rem;text-align:left;
  opacity:0;animation:fade-in-up .6s forwards;
}
@keyframes fade-in-up{
  0%{opacity:0;transform:translateY(20px)}
  100%{opacity:1;transform:translateY(0)}
}
.result-item .ri-text{font-size:1rem;line-height:1.8;margin-bottom:.5rem;word-break:keep-all}
.result-item .ri-author{font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;font-style:italic;color:var(--cyan);font-size:.9rem}
.result-item .ri-num{
  display:inline-block;background:linear-gradient(135deg,var(--red),var(--blue));
  color:#fff;font-size:.7rem;font-weight:700;padding:.2rem .7rem;border-radius:12px;margin-bottom:.6rem;
}

/* ── home link ── */


.home-link::before{content:'← ';font-size:.8rem}

/* ── sparkle burst on draw ── */
.sparkle-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100}
.sparkle{
  position:absolute;width:6px;height:6px;border-radius:50%;
  pointer-events:none;animation:sparkle-fly .8s ease-out forwards;
}
@keyframes sparkle-fly{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0)}
}

/* ── responsive ── */
@media(max-width:500px){
  .quote-card{padding:2rem 1.2rem 1.5rem}
  .draw-prompt .orb{width:110px;height:110px;font-size:2.2rem}
}

  /* ── 홈으로 돌아가기 버튼 (공통) ── */
  .home-link {
    display: inline-block;
    margin-top: 40px;
    color: #6e6e85;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 1px;
    transition: color 0.3s, border-color 0.3s;
    padding: 8px 16px;
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
  }
  .home-link:hover {
    color: #4895ef;
    border-color: rgba(72, 149, 239, 0.15);
  }
</style>
</head>

<div class="particles" id="particles"></div>

<div class="app">

    <div class="controls">

    </div>

    <a href="javascript:void(0)" class="home-link" onclick="resetAll()">처음으로</a>
  </div>

  <!-- ══ RESULT ══ -->
  <div id="result-screen">
    <p class="result-title">오늘 뽑힌 <span>명언 모음</span></p>
    <div class="result-list" id="resultList"></div>
    <div class="controls">
      <button class="ctrl-btn" onclick="resetAll()">다시 뽑기</button>
    </div>
    <a href="javascript:void(0)" class="home-link" onclick="resetAll()">처음으로</a>
  </div>

</div>

  o2.frequency.setValueAtTime(1400, audioCtx.currentTime + 0.05);
  o2.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 0.2);
  g2.gain.setValueAtTime(0.08, audioCtx.currentTime + 0.05);
  g2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
  o2.start(audioCtx.currentTime + 0.05);
  o2.stop(audioCtx.currentTime + 0.35);
}

function playClickSound(){
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(600, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
  g.gain.setValueAtTime(0.12, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
  o.start(audioCtx.currentTime);
  o.stop(audioCtx.currentTime + 0.12);
}

// ─── State ───
let drawCount = 3;
let drawn = [];
let currentIndex = 0;
let pool = [];

function changeCount(d){
  drawCount = Math.max(1, Math.min(10, drawCount + d));
  document.getElementById('countDisplay').textContent = drawCount;
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function startDraw(){
  playClickSound();
  pool = shuffle(quotes).slice(0, drawCount);
  drawn = [];
  currentIndex = 0;
  document.getElementById('totalNum').textContent = drawCount;
  document.getElementById('currentNum').textContent = 0;

  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('draw-screen').style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';

  const stage = document.getElementById('cardStage');
  // clear old cards
  stage.querySelectorAll('.quote-card').forEach(c=>c.remove());
  document.getElementById('drawPrompt').style.display = '';
}

function drawNext(){
  if(currentIndex >= pool.length) return;
  playDrawSound();

  const [text, author] = pool[currentIndex];
  currentIndex++;
  document.getElementById('currentNum').textContent = currentIndex;

  // sparkle effect
  burstSparkles();

  const stage = document.getElementById('cardStage');

  // push previous cards down / fade
  const prev = stage.querySelectorAll('.quote-card');
  prev.forEach((card, i) => {
    card.classList.remove('reveal');
    card.classList.add('stacked');
    const offset = (prev.length - i) * 8;
    card.style.transform = `translateX(-50%) translateY(${offset}px) scale(${1 - (prev.length - i)*0.03})`;
    card.style.opacity = Math.max(0.15, 1 - (prev.length - i)*0.25);
    card.style.filter = `blur(${(prev.length - i)*1.5}px)`;
    card.style.zIndex = i;
  });

  // create new card
  const card = document.createElement('div');
  card.className = 'quote-card reveal';
  card.style.zIndex = 50;
  const isEven = currentIndex % 2 === 0;
  const accent = isEven ? 'var(--blue)' : 'var(--red)';
  card.innerHTML = `
    <div class="card-number">${currentIndex} / ${pool.length}</div>
    <p class="quote-text">${text}</p>
    <div class="divider"></div>
    <p class="quote-author">— ${author}</p>
  `;
  stage.appendChild(card);

  // hide prompt if all drawn
  if(currentIndex >= pool.length){
    document.getElementById('drawPrompt').style.display = 'none';
    setTimeout(showResult, 1800);
  }
}

function showResult(){
  document.getElementById('draw-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  const list = document.getElementById('resultList');
  list.innerHTML = '';
  pool.forEach(([text, author], i) => {
    const item = document.createElement('div');
    item.className = 'result-item';
    item.style.animationDelay = `${i * 0.15}s`;
    item.innerHTML = `
      <div class="ri-num">${i+1}</div>
      <p class="ri-text">${text}</p>
      <p class="ri-author">— ${author}</p>
    `;
    list.appendChild(item);
  });
}

function resetAll(){
  playClickSound();
  document.getElementById('setup-screen').style.display = '';
  document.getElementById('draw-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'none';
}

// ─── Sparkle Burst ───
function burstSparkles(){
  const container = document.getElementById('sparkles');
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const colors = ['var(--red)','var(--blue)','var(--cyan)','#fff'];

  for(let i = 0; i < 24; i++){
    const s = document.createElement('div');
    s.className = 'sparkle';
    const angle = (Math.PI * 2 / 24) * i + (Math.random() - .5);
    const dist = 80 + Math.random() * 140;
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    s.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
    s.style.background = colors[Math.floor(Math.random()*colors.length)];
    s.style.width = s.style.height = (3 + Math.random()*5) + 'px';
    container.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

// ─── Background Particles ───
(function initParticles(){
  const container = document.getElementById('particles');
  const colors = ['var(--red)','var(--blue)','var(--cyan)'];
  for(let i = 0; i < 18; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random()*100 + '%';
    p.style.width = p.style.height = (2 + Math.random()*4) + 'px';
    p.style.background = colors[Math.floor(Math.random()*3)];
    p.style.animationDuration = (8 + Math.random()*12) + 's';
    p.style.animationDelay = (Math.random()*10) + 's';
    container.appendChild(p);
  }
})();
</script>
