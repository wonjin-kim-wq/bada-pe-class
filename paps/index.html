<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPS 셔틀런 기록장 & 메일 전송기</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- 실시간 엑셀 문서 변환용 공식 라이브러리 CDN 로드 (가장 가벼운 검증 최신 버전) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep: #0a0e1a;
            --bg-card: #111827;
            --bg-surface: #1a2236;
            --border: #1e2d4a;
            --text-primary: #e8ecf4;
            --text-muted: #6b7a94;
            --accent-red: #ef4444;
            --accent-red-glow: rgba(239, 68, 68, 0.4);
            --accent-blue: #3b82f6;
            --accent-blue-deep: #1d4ed8;
            --accent-blue-glow: rgba(59, 130, 246, 0.3);
            --card-active: linear-gradient(135deg, #1e3a5f, #162d50);
            --card-dropped: linear-gradient(135deg, #1a1a2e, #16162a);
            --success: #10b981;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            user-select: none;
            overflow-x: hidden;
            min-height: 100dvh;
        }

        /* ===== SETUP SCREEN ===== */
        #setup-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 24px;
        }

        .setup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 440px;
        }

        .setup-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 28px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px var(--accent-blue-glow);
        }

        .setup-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-blue);
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-shadow: 0 0 20px var(--accent-blue-glow);
        }

        .setup-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 22px;
            text-align: left;
        }

        .setup-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #a0c4ff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .stepper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stepper button {
            width: 48px;
            height: 48px;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .stepper button:hover { background: #243352; border-color: var(--accent-blue); }
        .stepper button:active { transform: scale(0.93); }

        .stepper input {
            flex: 1;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }
        .stepper input:focus { border-color: var(--accent-blue); }

        /* 이메일 주소 입력 필드 */
        .email-input {
            width: 100%;
            background: var(--bg-deep);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
            color: #fff;
            outline: none;
            text-align: center;
            transition: all 0.25s;
        }
        .email-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        .start-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent-blue-deep), var(--accent-blue));
            color: #fff;
            box-shadow: 0 4px 24px var(--accent-blue-glow);
        }
        .start-btn:hover { box-shadow: 0 6px 32px rgba(59,130,246,0.5); transform: translateY(-1px); }
        .start-btn:active { transform: translateY(0) scale(0.98); }

        .home-link {
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }
        .home-link:hover { color: var(--text-primary); }

        /* ===== MAIN SCREEN ===== */
        #main-screen {
            display: none;
            flex-direction: column;
            height: 100dvh;
            padding: 12px;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
        }
        #main-screen.visible { display: flex; }

        .top-area {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            height: 60dvh;
            min-height: 280px;
        }

        .counter-panel {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .counter-label {
            position: absolute;
            top: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        #main-counter {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(200px, 50vw, 55dvh);
            font-weight: 900;
            color: var(--accent-red);
            line-height: 1;
            text-shadow: 0 0 40px var(--accent-red-glow);
            transition: text-shadow 0.2s;
        }

        @keyframes counter-pop {
            0% { transform: scale(1); }
            40% { transform: scale(1.08); text-shadow: 0 0 60px var(--accent-red-glow), 0 0 120px rgba(239,68,68,0.2); }
            100% { transform: scale(1); }
        }
        #main-counter.pop { animation: counter-pop 0.25s ease-out; }

        .timer-display {
            position: absolute;
            bottom: 32px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        .audio-credit {
            position: absolute;
            bottom: 10px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .playback-controls {
            position: absolute;
            top: 14px;
            right: 16px;
            display: flex;
            gap: 8px;
        }
        .btn-playback {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-muted);
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-playback:hover { background: #243352; color: var(--text-primary); border-color: var(--accent-blue); }
        .btn-playback.playing { color: var(--success); border-color: var(--success); }

        .progress-track {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-blue), #06b6d4);
            transition: width 0.1s linear;
            border-radius: 0 2px 0 0;
        }

        /* Student Grid */
        .grid-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            padding-bottom: 8px;
        }
        .grid-scroll::-webkit-scrollbar { width: 5px; }
        .grid-scroll::-webkit-scrollbar-track { background: transparent; }
        .grid-scroll::-webkit-scrollbar-thumb { background: #2a3550; border-radius: 10px; }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .s-card {
            background: var(--card-active);
            border: 2px solid #2a4a7a;
            border-radius: 14px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }
        .s-card:hover { border-color: var(--accent-blue); box-shadow: 0 0 16px var(--accent-blue-glow); }
        .s-card:active { transform: scale(0.94); }

        .s-card .s-num {
            font-size: 22px;
            font-weight: 800;
            color: #a0c4ff;
        }
        .s-card .s-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-red);
            margin-top: 4px;
            opacity: 0;
            transform: translateY(6px);
            transition: all 0.3s ease;
        }

        .s-card.dropped {
            background: var(--card-dropped);
            border-color: #2a2a3e;
            cursor: default;
            box-shadow: none;
        }
        .s-card.dropped:hover { border-color: #2a2a3e; box-shadow: none; }
        .s-card.dropped .s-num { color: #555a70; }
        .s-card.dropped .s-score { opacity: 1; transform: translateY(0); }

        /* Bottom Controls */
        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 4px;
            gap: 12px;
        }

        .btn-secondary {
            padding: 10px 20px;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: #243352; color: var(--text-primary); }

        .btn-export {
            padding: 12px 28px;
            border: 1px solid var(--accent-red);
            background: linear-gradient(135deg, #7f1d1d, #991b1b);
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .btn-export:hover { box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3); }

        .help-text {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
        }

        /* ===== RESULT MODAL ===== */
        #result-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #result-modal.visible { display: flex; }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 460px;
            max-height: 90dvh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-blue);
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }

        .result-scroll {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-deep);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .result-scroll table { width: 100%; border-collapse: collapse; }
        .result-scroll th {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 8px 4px 12px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        .result-scroll td {
            padding: 10px 4px;
            text-align: center;
            border-bottom: 1px solid rgba(30,45,74,0.4);
            font-size: 15px;
        }
        .result-scroll tr:last-child td { border-bottom: none; }
        .result-scroll .td-num { font-weight: 600; color: #80a8d0; }
        .result-scroll .td-score { font-weight: 900; color: var(--accent-red); }
        .result-scroll .td-active { color: var(--success); font-weight: 600; }

        /* 후속 메일링 발송 영역 */
        .mailing-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: left;
        }
        .mailing-panel-title {
            font-size: 13px;
            font-weight: bold;
            color: #a0c4ff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .mailing-panel-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.4;
        }

        .s-send-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .s-send-btn:hover:not(:disabled) { background: #0284c7; box-shadow: 0 0 12px rgba(3, 105, 161, 0.4); }
        .s-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .modal-action-row {
            display: flex;
            gap: 10px;
        }

        .btn-close-modal {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-blue-deep), var(--accent-blue));
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-close-modal:hover { box-shadow: 0 4px 20px var(--accent-blue-glow); }

        .btn-excel-save {
            padding: 14px 20px;
            border: 1px solid var(--border);
            background: #065f46;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-excel-save:hover { background: #047857; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .top-area { flex-direction: column; height: 60dvh; }
            .student-grid { grid-template-columns: repeat(4, 1fr); }
            .help-text { display: none; }
        }
        @media (max-width: 480px) {
            #main-counter { font-size: 50vw; }
            .student-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .s-card { min-height: 85px; padding: 8px 6px; }
            .s-card .s-num { font-size: 18px; }
            .s-card .s-score { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- ===== STEP 01. SETUP SCREEN ===== -->
    <div id="setup-screen">
        <div class="setup-container">
            <div class="setup-box">
                <div class="setup-title">SHUTTLE RUN</div>
                <div class="setup-subtitle">PAPS 왕복오래달리기 & 이메일 전송기</div>

                <!-- 학생 인원 수 선택 -->
                <div class="input-group">
                    <label class="setup-label" for="student-count">측정 대상 학생 수 (최대 40명)</label>
                    <div class="stepper">
                        <button id="btn-minus">−</button>
                        <input type="number" id="student-count" min="1" max="40" value="20">
                        <button id="btn-plus">+</button>
                    </div>
                </div>

                <!-- 교사 수신용 고정 이메일 주소 입력란 -->
                <div class="input-group">
                    <label class="setup-label" for="teacher-email">교사 수신용 이메일 주소</label>
                    <input type="email" id="teacher-email" class="email-input" placeholder="example@gmail.com" required>
                </div>

                <button id="start-btn" class="start-btn">측정 시작</button>
            </div>
            <a href="../index.html" class="home-link">체육 교실 홈으로 돌아가기</a>
        </div>
    </div>

    <!-- ===== STEP 02. MAIN MEASUREMENT SCREEN ===== -->
    <div id="main-screen">
        <div class="top-area">
            <div class="counter-panel">
                <span class="counter-label">CURRENT LAP</span>

                <!-- 일시정지 / 재생 버튼 -->
                <div class="playback-controls">
                    <button id="btn-pause" class="btn-playback playing" title="일시정지 / 재생">▶</button>
                </div>

                <div id="main-counter">0</div>
                <span id="time-display" class="timer-display">00:00</span>
                <span class="audio-credit">음원 출처: 훈쌤커버리 (Beep 수동 가설제어)</span>
                <div id="progress-bar" class="progress-track" style="width:0%"></div>
            </div>
        </div>

        <div class="grid-scroll">
            <div id="student-grid" class="student-grid"></div>
        </div>

        <div class="bottom-bar">
            <button id="restart-btn" class="btn-secondary">처음으로</button>
            <span class="help-text">카드 클릭 → 탈락 성적 즉각 기록 &nbsp;|&nbsp; 더블 클릭 → 값 수동 수정</span>
            <button id="export-btn" class="btn-export">기록 마감</button>
        </div>
    </div>

    <!-- ===== STEP 03. RESULT MODAL ===== -->
    <div id="result-modal">
        <div class="modal-box">
            <div class="modal-title">FINAL RESULT</div>
            
            <div class="result-scroll">
                <table>
                    <thead>
                        <tr>
                            <th style="width:50%">번호</th>
                            <th style="width:50%">기록 (회)</th>
                        </tr>
                    </thead>
                    <tbody id="result-table-body"></tbody>
                </table>
            </div>

            <!-- 자동 메일 전송 패널 구축 -->
            <div class="mailing-panel">
                <div class="mailing-panel-title">✉️ 실시간 엑셀 리포트 자동 전송</div>
                <input type="email" id="modal-teacher-email" class="email-input" style="padding: 10px; font-size: 14px;" placeholder="example@gmail.com">
                <button id="btn-send-mail" class="s-send-btn">엑셀 보고서 메일 전송</button>
                <div class="mailing-panel-desc">버셀 환경변수(SMTP_USER, SMTP_PASS)를 넣은 Gmail 계정에서 신뢰할 수 있게 직발송합니다.</div>
            </div>

            <div class="modal-action-row">
                <button id="btn-excel-download" class="btn-excel-save" title="기기에 직접 엑셀로 파일 내려받기">💾 엑셀 저장</button>
                <button id="close-modal-btn" class="btn-close-modal">완료 및 복귀</button>
            </div>
        </div>
    </div>

    <!-- 브라우저 핵심 가동 엔진 스크립트 -->
    <script>
        /* ===== STATE ===== */
        let audio;
        let isPlaying = false;
        let currentCount = 0;
        let syncInterval;
        let studentsData = [];
        let timerSeconds = 0;
        
        const teacherEmailInput = document.getElementById('teacher-email');
        const modalEmailInput = document.getElementById('modal-teacher-email');

        // 이메일 주소 세션/로컬 스토리지에 자동 보관
        if (localStorage.getItem('paps_saved_email')) {
            teacherEmailInput.value = localStorage.getItem('paps_saved_email');
            modalEmailInput.value = localStorage.getItem('paps_saved_email');
        }

        teacherEmailInput.addEventListener('input', (e) => {
            modalEmailInput.value = e.target.value;
            localStorage.setItem('paps_saved_email', e.target.value);
        });

        modalEmailInput.addEventListener('input', (e) => {
            teacherEmailInput.value = e.target.value;
            localStorage.setItem('paps_saved_email', e.target.value);
        });

        /*
         * 음원 파일 경로 설정
         */
        const AUDIO_SRC = 'shuttle_run.mp3';

        /* ===== SHUTTLE TIMINGS ===== */
        const shuttleTimings = (() => {
            const OFFSET = 29; // 앞 인트로 멘트 부분
            const stages = [
                { start: 0     + OFFSET, laps: 7,  lapTime: 9.00 },
                { start: 63    + OFFSET, laps: 8,  lapTime: 8.00 },
                { start: 127   + OFFSET, laps: 8,  lapTime: 7.58 },
                { start: 187.6 + OFFSET, laps: 9,  lapTime: 7.20 },
                { start: 252.4 + OFFSET, laps: 9,  lapTime: 6.86 },
                { start: 314.1 + OFFSET, laps: 10, lapTime: 6.55 },
                { start: 379.6 + OFFSET, laps: 10, lapTime: 6.26 },
                { start: 442.2 + OFFSET, laps: 11, lapTime: 6.00 },
                { start: 508.2 + OFFSET, laps: 11, lapTime: 5.76 },
                { start: 571.6 + OFFSET, laps: 11, lapTime: 5.54 },
                { start: 632.5 + OFFSET, laps: 12, lapTime: 5.33 },
                { start: 696.5 + OFFSET, laps: 12, lapTime: 5.14 },
                { start: 758.2 + OFFSET, laps: 13, lapTime: 4.97 },
                { start: 822.8 + OFFSET, laps: 13, lapTime: 4.80 },
                { start: 885.2 + OFFSET, laps: 13, lapTime: 4.65 },
            ];
            const beeps = [];
            stages.forEach(s => {
                let t = s.start;
                for (let i = 0; i < s.laps; i++) { beeps.push(t); t += s.lapTime; }
            });
            return beeps;
        })();

        /* ===== AUDIO SETUP ===== */
        function initAudio() {
            audio = new Audio(AUDIO_SRC);
            audio.preload = 'auto';

            audio.addEventListener('play', () => {
                isPlaying = true;
                startSyncLoop();
                updatePauseButton();
            });
            audio.addEventListener('pause', () => {
                isPlaying = false;
                stopSyncLoop();
                updatePauseButton();
            });
            audio.addEventListener('ended', () => {
                isPlaying = false;
                stopSyncLoop();
                updatePauseButton();
            });
        }

        /* ===== SYNC LOOP ===== */
        function startSyncLoop() {
            if (syncInterval) clearInterval(syncInterval);
            let prevT = Date.now();
            syncInterval = setInterval(() => {
                let t = 0;
                if (audio && !isNaN(audio.duration)) {
                    // mp3 실 가동 시 정밀 연동 적용
                    t = audio.currentTime;
                    if (audio.duration) {
                        const pct = (t / audio.duration) * 100;
                        document.getElementById('progress-bar').style.width = pct + '%';
                    }
                } else {
                    // 가상 타이머 포맷 적용
                    const now = Date.now();
                    timerSeconds += (now - prevT) / 1000;
                    t = timerSeconds;
                }
                prevT = Date.now();

                // 시간 표시기 포맷
                const mm = String(Math.floor(t / 60)).padStart(2, '0');
                const ss = String(Math.floor(t % 60)).padStart(2, '0');
                document.getElementById('time-display').textContent = `${mm}:${ss}`;

                // 현재 카운트 실시간 계산 매핑
                let calc = 0;
                for (let i = 0; i < shuttleTimings.length; i++) {
                    if (t >= shuttleTimings[i]) calc = i + 1; else break;
                }
                if (calc !== currentCount) { 
                    currentCount = calc; 
                    updateCounter(); 
                    playSynthBeep(); // 비프음 가동
                }
            }, 50);
        }

        function stopSyncLoop() { clearInterval(syncInterval); }

        function updateCounter() {
            const el = document.getElementById('main-counter');
            el.textContent = currentCount;
            el.classList.remove('pop');
            void el.offsetWidth;
            el.classList.add('pop');
        }

        // Web Audio API를 활용한 가상 하드웨어 청아한 전자 비프음 발진
        let audioCtx;
        function playSynthBeep() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime); // 1000Hz 신호음
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } catch (e) {
                console.warn(e);
            }
        }

        /* ===== CONTROLS ===== */
        function updatePauseButton() {
            const btn = document.getElementById('btn-pause');
            if (isPlaying) {
                btn.textContent = '⏸';
                btn.classList.add('playing');
            } else {
                btn.textContent = '▶';
                btn.classList.remove('playing');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initAudio();

            document.getElementById('btn-pause').addEventListener('click', () => {
                if (!audio) return;
                if (isPlaying) {
                    audio.pause();
                } else {
                    audio.play().catch(() => {
                        // 만약 MP3 파일이 준비되지 않았다면 타이머 단독으로 가상 재생 시작
                        isPlaying = true;
                        startSyncLoop();
                        updatePauseButton();
                    });
                }
            });
        });

        /* ===== SETUP CONTROL ===== */
        const countInput = document.getElementById('student-count');
        document.getElementById('btn-minus').addEventListener('click', () => {
            const v = parseInt(countInput.value) || 1;
            if (v > 1) countInput.value = v - 1;
        });
        document.getElementById('btn-plus').addEventListener('click', () => {
            const v = parseInt(countInput.value) || 1;
            if (v < 40) countInput.value = v + 1;
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            const num = parseInt(countInput.value);
            const email = teacherEmailInput.value.trim();

            if (!email) {
                alert('교사 이메일 주소를 입력하셔야 나중에 측정 성적표를 전송받을 수 있습니다. 올바른 메일을 써 넣어 주세요.');
                return;
            }

            studentsData = Array.from({ length: num }, (_, i) => ({ id: i + 1, count: null, dropped: false }));

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-screen').classList.add('visible');
            renderGrid();

            // 음원 재생 트리거
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(err => {
                    // 오디오 소스가 부재하거나 자동 재생 제한 시 타이머만 수동 즉각 가동
                    isPlaying = true;
                    startSyncLoop();
                    updatePauseButton();
                });
            }
        });

        /* ===== STUDENT GRID RENDER ===== */
        function renderGrid() {
            const grid = document.getElementById('student-grid');
            grid.innerHTML = '';
            studentsData.forEach(s => {
                const card = document.createElement('div');
                card.className = 's-card';
                card.dataset.id = s.id;
                card.innerHTML = `
                    <span class="s-num">${s.id}번</span>
                    <span class="s-score">0</span>
                `;

                // 클릭 탈락 지정
                card.addEventListener('click', () => { 
                    if (!s.dropped) {
                        dropStudent(s.id, card); 
                    }
                });

                // 더블클릭 수동 수치 보정
                card.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    const val = prompt(`${s.id}번 학생의 측정 성적을 수정입력하세요 (회):`, s.count !== null ? s.count : currentCount);
                    if (val !== null && !isNaN(val) && val.trim() !== '') {
                        s.count = parseInt(val);
                        s.dropped = true;
                        card.classList.add('dropped');
                        card.querySelector('.s-score').textContent = s.count + '회';
                    }
                });

                grid.appendChild(card);
            });
        }

        function dropStudent(id, el) {
            const s = studentsData.find(x => x.id === id);
            s.count = currentCount;
            s.dropped = true;
            el.classList.add('dropped');
            el.querySelector('.s-score').textContent = s.count + '회';
        }

        /* ===== BOTTOM ACTIONS ===== */
        document.getElementById('restart-btn').addEventListener('click', () => {
            if (confirm('전체 측정 기록을 포기하고 처음으로 세팅 화면으로 복귀할까요?')) {
                location.reload();
            }
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            if (audio) audio.pause();
            isPlaying = false;
            stopSyncLoop();

            const tbody = document.getElementById('result-table-body');
            tbody.innerHTML = '';
            
            studentsData.forEach(s => {
                // 기록되지 않은 (끝까지 달린) 학생들 마감 기록 부여
                if (s.count === null) {
                    s.count = currentCount;
                    s.dropped = true;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="td-num">${s.id}번 학생</td>
                    <td class="td-score">${s.count} 회</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('result-modal').classList.add('visible');
        });

        document.getElementById('close-modal-btn').addEventListener('click', () => {
            if (confirm('측정 리포트 분석을 마치고 완전히 처음 화면으로 복귀할까요?')) {
                location.reload();
            }
        });

        /* ===== 엑셀 생성 및 파일 변환 보드 (SheetJS 활용) ===== */
        function generateExcelBase64() {
            const dataToFormat = studentsData.map(s => {
                let grade = "5등급";
                const c = s.count || 0;
                if (c >= 50) grade = "1등급 (우수)";
                else if (c >= 35) grade = "2등급 (양호)";
                else if (c >= 21) grade = "3등급 (보통)";
                else if (c >= 10) grade = "4등급 (노력요함)";

                return {
                    "학생 번호": `${s.id}번`,
                    "PAPS 측정 결과 (회)": c,
                    "체력 평가 등급": grade,
                    "측정 시간": new Date().toLocaleString()
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(dataToFormat);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "PAPS 셔틀런 분석기");
            
            // Base64 데이터 문자열 변형
            const xlsxBase64 = XLSX.write(workbook, { bookType: 'xlsx', type: 'base64' });
            return xlsxBase64;
        }

        // 로컬 브라우저 기기 자체 엑셀 저장
        document.getElementById('btn-excel-download').addEventListener('click', () => {
            const dataToFormat = studentsData.map(s => {
                let grade = "5등급";
                const c = s.count || 0;
                if (c >= 50) grade = "1등급";
                else if (c >= 35) grade = "2등급";
                else if (c >= 21) grade = "3등급";
                else if (c >= 10) grade = "4등급";

                return {
                    "학생 번호": `${s.id}번`,
                    "PAPS 측정 결과 (회)": c,
                    "체력 평가 등급": grade,
                    "측정 시간": new Date().toLocaleString()
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(dataToFormat);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "셔틀런 성정표");
            XLSX.writeFile(workbook, `PAPS_셔틀런_성적표_${new Date().toISOString().slice(0, 10)}.xlsx`);
        });

        /* ===== VERCEL BACKEND API 호출 이메일 발송 실시간 연동 ===== */
        const sendMailBtn = document.getElementById('btn-send-mail');
        
        sendMailBtn.addEventListener('click', async () => {
            const email = modalEmailInput.value.trim();
            if (!email) {
                alert('엑셀 성적표를 배송받을 이메일 주소를 입력하세요.');
                return;
            }

            sendMailBtn.disabled = true;
            sendMailBtn.textContent = '✈️ 메일 발송 중...잠시만 기다려주세요.';

            try {
                // 실시간 엑셀 Base64 파일 생성
                const base64Data = generateExcelBase64();

                // Vercel Serverless Function 호출 진행 (Vercel에서는 api/send-email 혹은 api/send-paps로 배포)
                // 만약 /api/send-email을 사용하신다면 아래 주소를 그대로 쓰시면 됩니다.
                const targetApiUrl = '/api/send-email';

                const response = await fetch(targetApiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        xlsxBase64: base64Data,
                        filename: `PAPS_셔틀런_결과리포트_${new Date().toISOString().slice(0, 10)}.xlsx`,
                        title: `[체육 시간] PAPS 왕복오래달리기 셔틀런 최종 성적 발급 건`,
                        studentCount: studentsData.length
                    })
                });

                // ★ 안전 조치: 응답이 JSON 형식이 아닐 경우에 대비해 예외 가두기
                const text = await response.text();
                let result;
                try {
                    result = JSON.parse(text);
                } catch (parseError) {
                    throw new Error(
                        `Vercel 서버가 정상 응답 대신 HTML 에러 페이지를 리턴했습니다. (상태 코드: ${response.status})\n\n` +
                        `[원인 및 해결 해결 방법]\n` +
                        `1. 버셀 설정(Settings)에 새 환경변수를 등록한 뒤 반드시 'Redeploy'를 한 번 실행해 주어야 바뀐 서버 환경이 동기화됩니다!\n` +
                        `2. 등록하신 'SMTP_PASS' 16자리 앱비밀번호에 공백이 없는가 정확히 검토해 보완하십시오.`
                    );
                }

                if (response.ok && result.success) {
                    alert('🎉 발송 성공!\n선생님의 메일함(' + email + ')으로 측정 결과 엑셀 보고서 첨부 전송이 완벽하게 끝났습니다.');
                } else {
                    throw new Error(result.error || '이메일 발송 요청 거부됨');
                }

            } catch (err) {
                console.error(err);
                alert('⚠️ 발송 실패!\n원인: ' + err.message);
            } finally {
                sendMailBtn.disabled = false;
                sendMailBtn.textContent = '엑셀 보고서 메일 전송';
            }
        });
    </script>
</body>
