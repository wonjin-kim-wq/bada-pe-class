<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPS 셔틀런 기록장 & 메일 전송기</title>
    <!-- 구글 폰트 및 아이콘 수급 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800;900&family=Orbitron:wght@750;900&display=swap" rel="stylesheet">
    <!-- SheetJS (실제 엑셀 바이너리 파일 생성을 위한 엔진) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep: #0a0e1a;
            --bg-card: #111827;
            --bg-surface: #1a2236;
            --border: #1e2d4a;
            --text-primary: #e8ecf4;
            --text-muted: #6b7a94;
            --accent-red: #ef4444;
            --accent-red-glow: rgba(239, 68, 68, 0.4);
            --accent-blue: #3b82f6;
            --accent-blue-deep: #1d4ed8;
            --accent-blue-glow: rgba(59, 130, 246, 0.3);
            --card-active: linear-gradient(135deg, #1e3a5f, #162d50);
            --card-dropped: linear-gradient(135deg, #1a1a2e, #16162a);
            --success: #10b981;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            user-select: none;
            overflow-x: hidden;
            min-height: 100dvh;
        }

        /* ===== SETUP SCREEN ===== */
        #setup-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 24px;
        }

        .setup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 420px;
        }

        .setup-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 28px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px var(--accent-blue-glow);
        }

        .setup-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: var(--accent-blue);
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 20px var(--accent-blue-glow);
        }

        .setup-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .setup-label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .stepper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stepper button {
            width: 48px;
            height: 48px;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .stepper button:hover { background: #243352; border-color: var(--accent-blue); }
        .stepper button:active { transform: scale(0.93); }

        .stepper input {
            flex: 1;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }
        .stepper input:focus { border-color: var(--accent-blue); }

        .input-email {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 28px;
            text-align: center;
        }
        .input-email:focus { border-color: var(--accent-blue); }

        .start-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent-blue-deep), var(--accent-blue));
            color: #fff;
            box-shadow: 0 4px 24px var(--accent-blue-glow);
        }
        .start-btn:hover { box-shadow: 0 6px 32px rgba(59,130,246,0.5); transform: translateY(-1px); }
        .start-btn:active { transform: translateY(0) scale(0.98); }

        .home-link {
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }
        .home-link:hover { color: var(--text-primary); }

        /* ===== MAIN SCREEN ===== */
        #main-screen {
            display: none;
            flex-direction: column;
            height: 100dvh;
            padding: 12px;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
        }
        #main-screen.visible { display: flex; }

        .top-area {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            height: 50dvh;
            min-height: 260px;
        }

        .counter-panel {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .counter-label {
            position: absolute;
            top: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        #main-counter {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(180px, 45vw, 45dvh);
            font-weight: 900;
            color: var(--accent-red);
            line-height: 1;
            text-shadow: 0 0 40px var(--accent-red-glow);
            transition: text-shadow 0.2s;
        }

        @keyframes counter-pop {
            0% { transform: scale(1); }
            40% { transform: scale(1.08); text-shadow: 0 0 60px var(--accent-red-glow); }
            100% { transform: scale(1); }
        }
        #main-counter.pop { animation: counter-pop 0.25s ease-out; }

        .timer-display {
            position: absolute;
            bottom: 32px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        .audio-credit {
            position: absolute;
            bottom: 10px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .playback-controls {
            position: absolute;
            top: 14px;
            right: 16px;
            display: flex;
            gap: 8px;
        }
        .btn-playback {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-muted);
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-playback:hover { background: #243352; color: var(--text-primary); border-color: var(--accent-blue); }
        .btn-playback.playing { color: var(--success); border-color: var(--success); }

        .progress-track {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-blue), #06b6d4);
            transition: width 0.1s linear;
        }

        /* Student Grid */
        .grid-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            padding-bottom: 8px;
        }
        .grid-scroll::-webkit-scrollbar { width: 5px; }
        .grid-scroll::-webkit-scrollbar-thumb { background: #2a3550; border-radius: 10px; }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .s-card {
            background: var(--card-active);
            border: 2px solid #2a4a7a;
            border-radius: 14px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .s-card:hover { border-color: var(--accent-blue); box-shadow: 0 0 16px var(--accent-blue-glow); }

        .s-card .s-num {
            font-size: 22px;
            font-weight: 800;
            color: #a0c4ff;
        }
        .s-card .s-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-red);
            margin-top: 4px;
            opacity: 0;
            transform: translateY(6px);
            transition: all 0.3s ease;
        }

        .s-card.dropped {
            background: var(--card-dropped);
            border-color: #2a2a3e;
            cursor: default;
        }
        .s-card.dropped .s-num { color: #555a70; }
        .s-card.dropped .s-score { opacity: 1; transform: translateY(0); }

        /* Bottom Controls */
        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 4px;
            gap: 12px;
        }

        .btn-secondary {
            padding: 10px 20px;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: #243352; color: var(--text-primary); }

        .btn-export {
            padding: 12px 28px;
            border: none;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #fff;
            font-size: 14px;
            font-weight: 850;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* ===== RESULT MODAL ===== */
        #result-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #result-modal.visible { display: flex; }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            max-width: 440px;
            max-height: 90dvh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-blue);
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2.5px;
        }

        .result-scroll {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-deep);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .result-scroll table { width: 100%; border-collapse: collapse; }
        .result-scroll th {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 8px 4px 12px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        .result-scroll td {
            padding: 10px 4px;
            text-align: center;
            border-bottom: 1px solid rgba(30,45,74,0.4);
            font-size: 15px;
        }
        .result-scroll tr:last-child td { border-bottom: none; }
        .result-scroll .td-num { font-weight: 600; color: #80a8d0; }
        .result-scroll .td-score { font-weight: 900; color: var(--accent-red); }

        .email-send-area {
            background: var(--bg-surface);
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .email-send-area label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .email-status-text {
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
            line-height: 1.5;
        }

        .btn-email-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent-blue-deep), var(--accent-blue));
            color: white;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-email-submit:hover { opacity: 0.9; }

        .btn-close-modal {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #27272a;
            color: #d4d4d8;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-close-modal:hover { background: #3f3f46; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .top-area { flex-direction: column; height: auto; }
            .student-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 480px) {
            #main-counter { font-size: 40vw; }
            .student-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .s-card { min-height: 85px; }
        }
    </style>
</head>
<body>

    <!-- 설정 및 이메일 입력 화면 -->
    <div id="setup-screen">
        <div class="setup-container">
            <div class="setup-box">
                <div class="setup-title">SHUTTLE RUN</div>
                <div class="setup-subtitle">PAPS 왕복오래달리기 기록장</div>

                <label class="setup-label" for="student-count">측정 학생 수 (최대 40명)</label>
                <div class="stepper">
                    <button id="btn-minus">−</button>
                    <input type="number" id="student-count" min="1" max="40" value="20">
                    <button id="btn-plus">+</button>
                </div>

                <label class="setup-label" for="teacher-email">교사 이메일 주소</label>
                <input type="email" id="teacher-email" class="input-email" placeholder="교사 메일주소@naver.com" required>

                <button id="start-btn" class="start-btn">측정 시작하기</button>
            </div>
            <a href="../index.html" class="home-link">홈으로 돌아가기</a>
        </div>
    </div>

    <!-- 주 측정 보드 화면 -->
    <div id="main-screen">
        <div class="top-area">
            <div class="counter-panel">
                <span class="counter-label">CURRENT LAP</span>

                <div class="playback-controls">
                    <button id="btn-pause" class="btn-playback playing">▶</button>
                </div>

                <div id="main-counter">0</div>
                <span id="time-display" class="timer-display">00:00</span>
                <span class="audio-credit">음원 출처: 훈쌤커버리</span>
                <div id="progress-bar" class="progress-track" style="width:0%"></div>
            </div>
        </div>

        <div class="grid-scroll">
            <div id="student-grid" class="student-grid"></div>
        </div>

        <div class="bottom-bar">
            <button id="restart-btn" class="btn-secondary">처음으로</button>
            <span class="help-text" style="font-size: 11px; color:#555a70;">※ 카드 클릭 → 탈락 처리 및 기록 확정</span>
            <button id="export-btn" class="btn-export">기록 마감</button>
        </div>
    </div>

    <!-- 결과 모달 및 실시간 메일 전송 패널 -->
    <div id="result-modal">
        <div class="modal-box">
            <div class="modal-title">FINAL RESULT</div>
            
            <div class="result-scroll">
                <table>
                    <thead>
                        <tr>
                            <th style="width:50%">번호</th>
                            <th style="width:50%">기록 (회)</th>
                        </tr>
                    </thead>
                    <tbody id="result-table-body"></tbody>
                </table>
            </div>

            <!-- 메일 발송 전진기 기지 -->
            <div class="email-send-area">
                <label for="modal-email">수신받을 이메일 주소</label>
                <input type="email" id="modal-email" class="input-email" style="margin-bottom:10px; padding:10px; font-size:14px;" placeholder="example@naver.com">
                <label for="modal-subject">이메일 제목</label>
                <input type="text" id="modal-subject" class="input-email" style="margin-bottom:10px; padding:10px; font-size:14px;" placeholder="이메일 제목을 입력해주세요.">
                <button id="btn-trigger-email" class="btn-email-submit">📧 엑셀 리포트 이메일로 전송</button>
                <div id="email-status-msg" class="email-status-text"></div>
            </div>

            <button id="close-modal-btn" class="btn-close-modal">완료 및 홈으로</button>
        </div>
    </div>

    <script>
        /* ===== STATE ===== */
        let audio;
        let isPlaying = false;
        let currentCount = 0;
        let syncInterval;
        let studentsData = [];

        /* ★ 음원 파일 원천 지정 */
        const AUDIO_SRC = 'shuttle_run.mp3';

        // 이메일 주소 브라우저 영구보존
        const emailInput = document.getElementById('teacher-email');
        const modalEmailInput = document.getElementById('modal-email');

        document.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('paps_saved_email') || '';
            emailInput.value = savedEmail;
            modalEmailInput.value = savedEmail;
            initAudio();
        });

        emailInput.addEventListener('input', () => {
            localStorage.setItem('paps_saved_email', emailInput.value);
            modalEmailInput.value = emailInput.value;
        });
        modalEmailInput.addEventListener('input', () => {
            localStorage.setItem('paps_saved_email', modalEmailInput.value);
            emailInput.value = modalEmailInput.value;
        });

        /* ===== SHUTTLE TIMINGS (29초 오프셋 적용 공식 비프테스트 타임라인) ===== */
        const shuttleTimings = (() => {
            const OFFSET = 29;
            const stages = [
                { start: 0     + OFFSET, laps: 7,  lapTime: 9.00 },
                { start: 63    + OFFSET, laps: 8,  lapTime: 8.00 },
                { start: 127   + OFFSET, laps: 8,  lapTime: 7.58 },
                { start: 187.6 + OFFSET, laps: 9,  lapTime: 7.20 },
                { start: 252.4 + OFFSET, laps: 9,  lapTime: 6.86 },
                { start: 314.1 + OFFSET, laps: 10, lapTime: 6.55 },
                { start: 379.6 + OFFSET, laps: 10, lapTime: 6.26 },
                { start: 442.2 + OFFSET, laps: 11, lapTime: 6.00 },
                { start: 508.2 + OFFSET, laps: 11, lapTime: 5.76 },
                { start: 571.6 + OFFSET, laps: 11, lapTime: 5.54 },
                { start: 632.5 + OFFSET, laps: 12, lapTime: 5.33 },
                { start: 696.5 + OFFSET, laps: 12, lapTime: 5.14 },
                { start: 758.2 + OFFSET, laps: 13, lapTime: 4.97 },
                { start: 822.8 + OFFSET, laps: 13, lapTime: 4.80 },
                { start: 885.2 + OFFSET, laps: 13, lapTime: 4.65 },
            ];
            const beeps = [];
            stages.forEach(s => {
                let t = s.start;
                for (let i = 0; i < s.laps; i++) { beeps.push(t); t += s.lapTime; }
            });
            return beeps;
        })();

        /* ===== AUDIO SETUP (안정적인 로컬 HTML5 Audio 엔진 세팅) ===== */
        function initAudio() {
            audio = new Audio(AUDIO_SRC);
            audio.preload = 'auto';

            audio.addEventListener('play', () => {
                isPlaying = true;
                startSyncLoop();
                updatePauseButton();
            });
            audio.addEventListener('pause', () => {
                isPlaying = false;
                stopSyncLoop();
                updatePauseButton();
            });
            audio.addEventListener('ended', () => {
                isPlaying = false;
                stopSyncLoop();
                updatePauseButton();
            });
            audio.addEventListener('error', () => {
                console.warn('음원 로딩 대기 혹은 단순 누락 상태:', AUDIO_SRC);
            });
        }

        /* ===== REAL-TIME SYNC LOOP (오디오에 종속된 50ms 간격 안심 싱크) ===== */
        function startSyncLoop() {
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(() => {
                if (!audio) return;
                const t = audio.currentTime;

                // mm:ss 포맷 출력
                const m = String(Math.floor(t / 60)).padStart(2, '0');
                const s = String(Math.floor(t % 60)).padStart(2, '0');
                document.getElementById('time-display').textContent = `${m}:${s}`;

                // 프로그레스 바 동기화
                if (audio.duration) {
                    const pct = (t / audio.duration) * 100;
                    document.getElementById('progress-bar').style.width = pct + '%';
                }

                // 현재 재생 시간 기반 랩(합산 회수) 정밀 연산
                let calc = 0;
                for (let i = 0; i < shuttleTimings.length; i++) {
                    if (t >= shuttleTimings[i]) calc = i + 1; else break;
                }

                if (calc !== currentCount) {
                    currentCount = calc;
                    updateCounterDisplay();
                }
            }, 50);
        }

        function stopSyncLoop() { 
            clearInterval(syncInterval); 
        }

        function updateCounterDisplay() {
            const el = document.getElementById('main-counter');
            el.textContent = currentCount;
            el.classList.remove('pop');
            void el.offsetWidth;
            el.classList.add('pop');
        }

        function updatePauseButton() {
            const btn = document.getElementById('btn-pause');
            btn.textContent = isPlaying ? '⏸' : '▶';
        }

        /* ===== SETUP SCREEN CONTROLS ===== */
        const countInput = document.getElementById('student-count');
        document.getElementById('btn-minus').addEventListener('click', () => {
            const v = parseInt(countInput.value) || 1;
            if (v > 1) countInput.value = v - 1;
        });
        document.getElementById('btn-plus').addEventListener('click', () => {
            const v = parseInt(countInput.value) || 1;
            if (v < 40) countInput.value = v + 1;
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            const emailValue = emailInput.value.trim();
            if(!emailValue || !emailValue.includes('@')) {
                alert('교사 이메일 주소를 올바르게 입력해주세요.');
                return;
            }

            const num = parseInt(countInput.value);
            studentsData = Array.from({ length: num }, (_, i) => ({ id: i + 1, count: null, dropped: false }));

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-screen').classList.add('visible');
            renderGrid();

            // 사용자 연동 제스처 내부에서 즉시 물리 오디오 play()를 호출하여 Autoplay 제한 정책 통과
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => {
                    console.warn('사용자 정책 차단 감지, ▶ 버튼 클릭 유도 필요:', e);
                });
            }
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            if (!audio) return;
            if (isPlaying) {
                audio.pause();
            } else {
                audio.play().catch(e => console.warn(e));
            }
        });

        /* ===== STUDENT GRID ===== */
        function renderGrid() {
            const grid = document.getElementById('student-grid');
            grid.innerHTML = '';
            studentsData.forEach(s => {
                const card = document.createElement('div');
                card.className = 's-card';
                card.dataset.id = s.id;
                card.innerHTML = `
                    <span class="s-num">${s.id}번</span>
                    <span class="s-score">0</span>
                `;

                card.addEventListener('click', () => {
                    if (!s.dropped) {
                        s.dropped = true;
                        s.count = currentCount;
                        card.classList.add('dropped');
                        card.querySelector('.s-score').textContent = `${s.count}회`;
                    }
                });
                grid.appendChild(card);
            });
        }

        /* ===== RECORD EXPORT & MODAL ===== */
        document.getElementById('restart-btn').addEventListener('click', () => {
            if (confirm('모든 데이터를 초기화하고 처음 단계로 돌아갈까요?')) location.reload();
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            if (audio) audio.pause();
            stopSyncLoop();

            // 진행 중인 잔류 학생들 기록 마감 일괄 매핑
            studentsData.forEach(s => {
                if(!s.dropped) {
                    s.dropped = true;
                    s.count = currentCount;
                }
            });

            const tbody = document.getElementById('result-table-body');
            tbody.innerHTML = '';
            studentsData.forEach(s => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="td-num">${s.id}번 학생</td>
                    <td class="td-score">${s.count}회</td>
                `;
                tbody.appendChild(tr);
            });

            // 이메일 제목 초기값 설정
            const today = new Date().toISOString().slice(0, 10);
            document.getElementById('modal-subject').value = `[바다쌤 체육교실] PAPS 왕복오래달리기 기록 (${today})`;

            document.getElementById('result-modal').classList.add('visible');
        });

        // 결과 모달 종료 시 전체 초기 리로드
        document.getElementById('close-modal-btn').addEventListener('click', () => {
            location.reload();
        });

        /* ===== 이메일 연동 로직 (SheetJS로 바이너리 엑셀 가공 후 전송) ===== */
        document.getElementById('btn-trigger-email').addEventListener('click', async () => {
            const emailAddr = modalEmailInput.value.trim();
            const emailSubject = document.getElementById('modal-subject').value.trim() || `[바다쌤 체육교실] PAPS 왕복오래달리기 전체 기록안내 엑셀파일`;
            const statusDiv = document.getElementById('email-status-msg');

            if (!emailAddr || !emailAddr.includes('@')) {
                alert('전송받을 상대 이메일 주소를 올바르게 채워주세요.');
                return;
            }

            statusDiv.style.color = '#3b82f6';
            statusDiv.textContent = '📥 결과 데이터를 분석하여 엑셀 변환을 진행하고 있습니다...';

            try {
                // 1. SheetJS를 사용하여 실질적인 가공 엑셀 바이너리 데이터 준비
                const sorted = [...studentsData].sort((a,b) => a.id - b.id);
                const excelRows = sorted.map(s => ({
                    "학생 번호": `${s.id}번`,
                    "측정 기록 (회)": s.count,
                    "PAPS 간이 등급": s.count >= 35 ? "우수" : s.count >= 20 ? "보통" : "기초체력부족",
                    "측정 일자": new Date().toLocaleString('ko-KR')
                }));

                const worksheet = XLSX.utils.json_to_sheet(excelRows);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "PAPS 셔틀런 결과");

                // 바이너리 에코 인코딩 Base64 추출
                const base64Excel = XLSX.write(workbook, { bookType: 'xlsx', type: 'base64' });

                statusDiv.textContent = '🚀 Vercel 통합 이메일 게이트웨이 송신 처리 중...';

                // 2. 버셀 백엔드 엔드포인트 호출 (/api/send-email)
                const endpoint = '/api/send-email'; 
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: emailAddr,
                        xlsxBase64: base64Excel,
                        filename: `PAPS_셔틀런_결과표_${new Date().toISOString().slice(0, 10)}.xlsx`,
                        title: emailSubject,
                        studentCount: excelRows.length
                    })
                });

                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch(pe) {
                    throw new Error(
                        `⚠️ Vercel 오류 발생! (새로운 API 파일 등록 후, Vercel 대시보드에서 'Redeploy'를 꼭 눌러서 동기화하셔야 합니다!)`
                    );
                }

                if (response.ok && result.success) {
                    statusDiv.style.color = '#10b981';
                    statusDiv.textContent = result.preview 
                        ? '🧪 (시뮬레이션 가상전송 완료) Vercel 환경변수 설정이 끝나면 실 전송이 시작됩니다.'
                        : '🔥 전송 성공! 지정하신 이메일 메일함으로 엑셀 보고서 발송이 완료되었습니다.';
                    alert('성공적으로 메일이 발송되었습니다!');
                } else {
                    throw new Error(result.error || result.detail || '메일 발송 거절됨');
                }

            } catch (err) {
                console.error(err);
                statusDiv.style.color = '#ef4444';
                statusDiv.textContent = `❌ 발송 실패!\n원인: ${err.message}`;
                alert(`⚠️ 발송 실패!\n\n원인: ${err.message || '알 수 없는 서버 환경 네트워크 장애'}`);
            }
        });
    </script>
</body>
</html>
