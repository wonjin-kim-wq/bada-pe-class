<html lang="ko">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리듬 줄넘기</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0a0a0f;
    --bg-card: #12121a;
    --red: #ff2d55;
    --red-glow: rgba(255, 45, 85, 0.4);
    --blue: #007aff;
    --blue-glow: rgba(0, 122, 255, 0.4);
    --text: #e8e8ed;
    --text-dim: #6e6e80;
    --border: #1c1c2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg-dark);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .bg-grid {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    background-image:
      linear-gradient(rgba(255,45,85,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,122,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridPulse 8s ease-in-out infinite;
    pointer-events: none; z-index: 0;
  }
  @keyframes gridPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .bg-orb {
    position: fixed; border-radius: 50%; filter: blur(100px);
    pointer-events: none; z-index: 0;
  }
  .bg-orb.red {
    width: 400px; height: 400px;
    background: var(--red-glow);
    top: -100px; right: -100px;
    animation: orbFloat 12s ease-in-out infinite;
  }
  .bg-orb.blue {
    width: 350px; height: 350px;
    background: var(--blue-glow);
    bottom: -80px; left: -80px;
    animation: orbFloat 15s ease-in-out infinite reverse;
  }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.1); }
    66% { transform: translate(-20px, 30px) scale(0.9); }
  }

  .screen {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10;
    transition: opacity 0.5s, transform 0.5s;
  }
  .screen.hidden {
    opacity: 0; pointer-events: none;
    transform: scale(0.95);
  }

  .logo-icon {
    width: 90px; height: 90px;
    margin-bottom: 20px;
    animation: ropeSwing 2s ease-in-out infinite;
  }
  @keyframes ropeSwing {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  .title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(2.5rem, 6vw, 4rem);
    letter-spacing: -1px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--red), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.95rem;
    margin-bottom: 50px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .difficulty-buttons {
    display: flex; flex-direction: column;
    gap: 16px; width: min(320px, 85vw);
  }

  .diff-btn {
    position: relative;
    padding: 18px 32px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: var(--bg-card);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .diff-btn::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  }
  .diff-btn.easy::before { background: var(--blue); }
  .diff-btn.normal::before { background: linear-gradient(180deg, var(--blue), var(--red)); }
  .diff-btn.hard::before { background: var(--red); }
  .diff-btn.hell::before { background: linear-gradient(180deg, #ff2d55, #ff6600, #ff2d55); animation: hellPulse 1s ease-in-out infinite; }

  @keyframes hellPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .diff-btn:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.1);
  }
  .diff-btn.easy:hover { box-shadow: 0 8px 30px rgba(0,122,255,0.2); }
  .diff-btn.normal:hover { box-shadow: 0 8px 30px rgba(128,80,170,0.2); }
  .diff-btn.hard:hover { box-shadow: 0 8px 30px rgba(255,45,85,0.2); }
  .diff-btn.hell:hover { box-shadow: 0 8px 30px rgba(255,102,0,0.3); }

  .diff-label { display: flex; align-items: center; gap: 10px; }
  .diff-dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .diff-btn.easy .diff-dot { background: var(--blue); box-shadow: 0 0 8px var(--blue-glow); }
  .diff-btn.normal .diff-dot { background: #8050aa; box-shadow: 0 0 8px rgba(128,80,170,0.4); }
  .diff-btn.hard .diff-dot { background: var(--red); box-shadow: 0 0 8px var(--red-glow); }
  .diff-btn.hell .diff-dot { background: #ff6600; box-shadow: 0 0 8px rgba(255,102,0,0.5); animation: hellDotPulse 0.5s ease-in-out infinite; }

  @keyframes hellDotPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.4); }
  }

  .home-link {
    margin-top: 50px;
    color: var(--text-dim);
    font-size: 0.85rem;
    text-decoration: none;
    letter-spacing: 1px;
    transition: color 0.3s;
    cursor: pointer;
  }
  .home-link:hover { color: var(--text); }

  .countdown-num {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(6rem, 20vw, 12rem);
    background: linear-gradient(135deg, var(--red), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: countPop 0.8s ease-out;
  }
  @keyframes countPop {
    0% { transform: scale(2); opacity: 0; }
    60% { transform: scale(0.9); }
    100% { transform: scale(1); opacity: 1; }
  }
  .countdown-label {
    font-size: 1.1rem;
    color: var(--text-dim);
    margin-top: 16px;
    letter-spacing: 3px;
  }

  #gameScreen {
    justify-content: center;
    align-items: center;
    padding: 20px;
    gap: 0;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 700px;
    flex: 0 1 auto;
  }

  .game-header {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%;
    max-width: 600px;
    margin-bottom: 10px; /* 여백 축소 */
  }

  .timer-display {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(2rem, 4vw, 3rem);
    letter-spacing: 2px;
  }

  .timer-bar-wrap {
    width: 100%;
    max-width: 600px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 15px; /* 여백 축소 */
    overflow: hidden;
  }
  .timer-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--red));
    border-radius: 2px;
    transition: width 1s linear;
  }

  .difficulty-badge {
    font-size: clamp(0.75rem, 1.5vw, 1rem);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .card-container {
    perspective: 1000px;
    width: min(1100px, 95vw);
    height: min(600px, 60vh); /* 화면을 벗어나지 않게 높이 축소 */
  }

  .jump-card {
    width: 100%;
    height: 100%;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    position: relative;
    overflow: hidden;
    animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cardIn {
    0% { transform: rotateY(90deg) scale(0.8); opacity: 0; }
    100% { transform: rotateY(0) scale(1); opacity: 1; }
  }

  .card-glow {
    position: absolute; top: -1px; right: -1px; bottom: -1px; left: -1px;
    border-radius: 24px;
    background: linear-gradient(135deg, var(--red), transparent 40%, transparent 60%, var(--blue));
    opacity: 0.15;
    z-index: 0;
  }

  .card-icon {
    display: none;
    font-size: clamp(4rem, 12vw, 8rem);
    z-index: 1;
    animation: iconBounce 1s ease-in-out infinite;
  }
  @keyframes iconBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .card-name {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(3rem, 8vw, 5rem); /* 글자 크기 살짝 조정 */
    z-index: 1;
    text-align: center;
    padding: 0 20px;
  }

  .card-desc {
    font-size: clamp(1.4rem, 3.5vw, 2rem); /* 글자 크기 살짝 조정 */
    color: var(--text-dim);
    z-index: 1;
    text-align: center;
    padding: 0 30px;
    line-height: 1.5;
  }

  .card-timer-ring {
    position: absolute;
    bottom: 20px; right: 20px;
    width: 50px; height: 50px;
    z-index: 1;
  }
  .card-timer-ring svg {
    transform: rotate(-90deg);
  }
  .card-timer-ring circle {
    fill: none;
    stroke-width: 3;
  }
  .ring-bg { stroke: var(--border); }
  .ring-fill {
    stroke: var(--red);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.1s linear;
  }

  .end-icon {
    font-size: 5rem;
    margin-bottom: 20px;
    animation: iconBounce 1s ease-in-out infinite;
  }
  .end-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(2rem, 5vw, 3rem);
    margin-bottom: 10px;
    background: linear-gradient(135deg, var(--red), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .end-stats {
    color: var(--text-dim);
    font-size: 1rem;
    margin-bottom: 40px;
    text-align: center;
    line-height: 1.8;
  }
  .restart-btn {
    padding: 16px 48px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: var(--bg-card);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
  }
  .restart-btn:hover {
    border-color: var(--blue);
    box-shadow: 0 4px 20px var(--blue-glow);
    transform: translateY(-2px);
  }

  .card-rule {
    margin-top: 15px; /* 여백 축소 */
    font-size: clamp(0.9rem, 1.8vw, 1.1rem);
    font-weight: 700;
    color: var(--red);
    letter-spacing: 1px;
    text-align: center;
  }

  .pulse-ring {
    position: fixed;
    top: 50%; left: 50%;
    width: 300px; height: 300px;
    margin: -150px 0 0 -150px;
    border: 2px solid var(--red);
    border-radius: 50%;
    animation: pulseOut 0.6s ease-out forwards;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes pulseOut {
    0% { transform: scale(0.3); opacity: 0.8; }
    100% { transform: scale(2); opacity: 0; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-orb red"></div>
<div class="bg-orb blue"></div>

<div class="screen" id="homeScreen">
  <svg class="logo-icon" viewBox="0 0 90 90" fill="none">
    <path d="M25 70 Q45 10 65 70" stroke="url(#ropGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="25" cy="72" r="5" fill="#ff2d55"/>
    <circle cx="65" cy="72" r="5" fill="#007aff"/>
    <circle cx="45" cy="35" r="10" fill="#e8e8ed" opacity="0.9"/>
    <rect x="40" y="45" width="10" height="20" rx="3" fill="#e8e8ed" opacity="0.7"/>
    <defs><linearGradient id="ropGrad" x1="25" y1="70" x2="65" y2="70"><stop stop-color="#ff2d55"/><stop offset="1" stop-color="#007aff"/></linearGradient></defs>
  </svg>
  <h1 class="title">리듬 줄넘기</h1>
  <p class="subtitle">RHYTHM JUMP ROPE</p>

  <div class="difficulty-buttons">
    <button class="diff-btn easy" onclick="startGame('easy')">
      <span class="diff-label"><span class="diff-dot"></span>쉬움</span>
    </button>
    <button class="diff-btn normal" onclick="startGame('normal')">
      <span class="diff-label"><span class="diff-dot"></span>보통</span>
    </button>
    <button class="diff-btn hard" onclick="startGame('hard')">
      <span class="diff-label"><span class="diff-dot"></span>어려움</span>
    </button>
    <button class="diff-btn hell" onclick="startGame('hell')">
      <span class="diff-label"><span class="diff-dot"></span>지옥</span>
    </button>
  </div>

  <a class="home-link" href="../index.html">← 홈으로 돌아가기</a>
</div>

<div class="screen hidden" id="countdownScreen">
  <div class="countdown-num" id="countdownNum">3</div>
  <div class="countdown-label">준비하세요</div>
</div>

<div class="screen hidden" id="gameScreen">
  <div class="game-wrapper">
    <div class="game-header">
      <div class="timer-display" id="timerDisplay">05:00</div>
      <div class="difficulty-badge" id="diffBadge">쉬움</div>
    </div>
    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timerBar" style="width:100%"></div>
    </div>

    <div class="card-container">
      <div class="jump-card" id="jumpCard">
        <div class="card-glow"></div>
        <div class="card-icon" id="cardIcon">🏃</div>
        <div class="card-name" id="cardName">1단 뛰기</div>
        <div class="card-desc" id="cardDesc">기본 줄넘기 동작</div>
        <div class="card-timer-ring">
          <svg width="50" height="50" viewBox="0 0 50 50">
            <circle class="ring-bg" cx="25" cy="25" r="20"/>
            <circle class="ring-fill" id="ringFill" cx="25" cy="25" r="20"
              stroke-dasharray="125.66" stroke-dashoffset="0"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="card-rule">줄에 걸리면 제자리에 앉기</div>
    <a class="home-link" href="#" onclick="goHome(); return false;" style="margin-top:15px">← 처음으로 돌아가기</a>
  </div>
</div>

<div class="screen hidden" id="endScreen">
  <div class="end-icon">🎉</div>
  <h2 class="end-title">수고하셨습니다!</h2>
  <div class="end-stats" id="endStats">
    총 운동 시간: 5분<br>
    수행한 동작: 0개
  </div>
  <button class="restart-btn" onclick="goHome()">다시 하기</button>
  <a class="home-link" href="../index.html" style="margin-top:24px">← 홈으로 돌아가기</a>
</div>

<!-- ★ YouTube 플레이어 div 및 스크립트 완전 제거 -->

<script>
  // ── Jump Rope Cards Data ──
  const ALL_CARDS = [
    { id: 'single', name: '1단 뛰기', icon: '😊', desc: '기본 줄넘기! 두 발 모아 뛰세요' },
    { id: 'double', name: '2단 뛰기', icon: '😤', desc: '한 번에 줄을 두 번 돌리세요' },
    { id: 'cross', name: 'X자 뛰기', icon: '😎', desc: '팔을 교차하며 뛰세요' },
    { id: 'onefoot', name: '한발 뛰기', icon: '🤔', desc: '한쪽 발로만 뛰세요' },
    { id: 'alternate', name: '양발 번갈아뛰기', icon: '😆', desc: '달리듯이 번갈아 뛰세요' },
    { id: 'swing', name: '앞흔들어뛰기', icon: '🥳', desc: '앞으로 흔들며 뛰세요' },
    { id: 'sidejump', name: '좌우벌려뛰기', icon: '😜', desc: '양발을 좌우로 벌리며 뛰세요' },
    { id: 'scissors', name: '가위뛰기', icon: '😏', desc: '앞뒤로 다리를 벌리며 뛰세요' },
    { id: 'rps', name: '가위바위보 뛰기', icon: '🤩', desc: '가위바위보 동작을 하며 뛰세요' },
  ];

  const DIFFICULTY_CARDS = {
    easy: ['single', 'alternate', 'onefoot'],
    normal: ['single', 'cross', 'onefoot', 'alternate', 'swing'],
    hard: ALL_CARDS.map(c => c.id),
    hell: ALL_CARDS.map(c => c.id),
  };

  const DIFF_LABELS = { easy: '쉬움', normal: '보통', hard: '어려움', hell: '지옥' };

  // ── State ──
  let currentDifficulty = 'easy';
  let gameTimer = null;
  let cardTimer = null;
  let cardRingTimer = null;
  let timeLeft = 300;
  let totalCards = 0;
  let gameSessionId = 0;

  /*
   * ★★★ 음원 파일 경로 설정 ★★★
   * 이 HTML 파일과 같은 폴더에 mp3 파일을 두세요.
   * 파일명이 다르면 아래 경로만 수정하면 됩니다.
   */
  const MUSIC_SRC = 'jumprope_music.mp3';
  let bgMusic = null;

  // ── Global Audio Context (비프음용) ──
  let globalAudioCtx = null;
  function getAudioContext() {
    if (!globalAudioCtx) {
      globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (globalAudioCtx.state === 'suspended') {
      globalAudioCtx.resume();
    }
    return globalAudioCtx;
  }

  // ── 로컬 음원 초기화 ──
  function initMusic() {
    bgMusic = new Audio(MUSIC_SRC);
    bgMusic.preload = 'auto';
    bgMusic.loop = true; // 5분 동안 반복 재생

    bgMusic.addEventListener('error', () => {
      console.warn('음원 파일을 불러올 수 없습니다:', MUSIC_SRC);
      // 음원 없어도 게임은 진행 가능
    });
  }

  // ── 랜덤 구간 재생 (기존 YouTube 로직과 동일한 역할) ──
  function playRandomSegment() {
    if (!bgMusic) return;
    try {
      const duration = bgMusic.duration;
      const minStart = 3;

      if (duration && duration > 0 && isFinite(duration)) {
        const maxStart = Math.max(minStart, duration - 300);
        const startTime = Math.floor(Math.random() * (maxStart - minStart)) + minStart;
        bgMusic.currentTime = startTime;
      } else {
        bgMusic.currentTime = minStart;
      }
      bgMusic.play().catch(() => {});
    } catch(e) {
      console.log('Music playback error:', e);
    }
  }

  // ── Buzzer Sound ──
  function playBuzzer() {
    return new Promise(resolve => {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.4);
        setTimeout(resolve, 700);
      } catch(e) {
        setTimeout(resolve, 700);
      }
    });
  }

  function playStartBuzzer() {
    return new Promise(resolve => {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1200, ctx.currentTime);
        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.6);
        setTimeout(resolve, 600);
      } catch(e) {
        setTimeout(resolve, 600);
      }
    });
  }

  // ── Screen Management ──
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  function goHome() {
    stopGame();
    showScreen('homeScreen');
  }

  // ── Start Game ──
  async function startGame(difficulty) {
    currentDifficulty = difficulty;
    totalCards = 0;
    timeLeft = 300;

    const currentSession = ++gameSessionId;

    // ★ 사용자 제스처 안에서 AudioContext + Audio 초기화 → 자동재생 정책 통과
    getAudioContext();
    if (!bgMusic) initMusic();

    // 음원을 살짝 재생했다 멈춰서 브라우저 잠금 해제
    bgMusic.volume = 0;
    bgMusic.play().then(() => {
      bgMusic.pause();
      bgMusic.volume = 1;
    }).catch(() => {});

    showScreen('countdownScreen');

    // Countdown 3-2-1
    for (let i = 3; i >= 1; i--) {
      if (currentSession !== gameSessionId) return;
      const el = document.getElementById('countdownNum');
      el.textContent = i;
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = 'countPop 0.8s ease-out';
      await playBuzzer();
    }

    if (currentSession !== gameSessionId) return;

    const el = document.getElementById('countdownNum');
    el.textContent = 'GO!';
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = 'countPop 0.8s ease-out';
    await playStartBuzzer();

    if (currentSession !== gameSessionId) return;

    // ★ 음악 시작
    playRandomSegment();

    document.getElementById('diffBadge').textContent = DIFF_LABELS[difficulty];
    showScreen('gameScreen');
    startGameLoop();
  }

  // ── Game Loop ──
  function startGameLoop() {
    updateTimer();
    gameTimer = setInterval(() => {
      timeLeft--;
      updateTimer();
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);

    showNextCard();
  }

  function updateTimer() {
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    document.getElementById('timerBar').style.width = `${(timeLeft / 300) * 100}%`;
  }

  function getCardDuration() {
    if (currentDifficulty === 'easy') return 8;
    if (currentDifficulty === 'hell') return Math.floor(Math.random() * 3) + 2;
    return Math.floor(Math.random() * 8) + 3;
  }

  let lastCardId = null;

  function showNextCard() {
    const availableIds = DIFFICULTY_CARDS[currentDifficulty];
    let randomId;

    if (currentDifficulty === 'hell') {
      do {
        randomId = availableIds[Math.floor(Math.random() * availableIds.length)];
      } while (randomId === lastCardId && availableIds.length > 1);
    } else {
      randomId = availableIds[Math.floor(Math.random() * availableIds.length)];
    }

    lastCardId = randomId;
    const card = ALL_CARDS.find(c => c.id === randomId);

    const pulse = document.createElement('div');
    pulse.className = 'pulse-ring';
    document.body.appendChild(pulse);
    setTimeout(() => pulse.remove(), 600);

    const jumpCard = document.getElementById('jumpCard');
    jumpCard.style.animation = 'none';
    void jumpCard.offsetWidth;
    jumpCard.style.animation = 'cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';

    document.getElementById('cardIcon').textContent = card.icon;
    document.getElementById('cardName').textContent = card.name;
    document.getElementById('cardDesc').textContent = card.desc;

    totalCards++;

    const duration = getCardDuration();
    const circumference = 125.66;
    const ringFill = document.getElementById('ringFill');
    let elapsed = 0;

    clearInterval(cardRingTimer);
    ringFill.style.strokeDashoffset = '0';

    cardRingTimer = setInterval(() => {
      elapsed += 0.1;
      const progress = elapsed / duration;
      ringFill.style.strokeDashoffset = (circumference * progress).toString();
    }, 100);

    clearTimeout(cardTimer);
    cardTimer = setTimeout(() => {
      clearInterval(cardRingTimer);
      if (timeLeft > 0) showNextCard();
    }, duration * 1000);
  }

  function stopGame() {
    gameSessionId++;
    clearInterval(gameTimer);
    clearTimeout(cardTimer);
    clearInterval(cardRingTimer);
    gameTimer = null;
    cardTimer = null;
    cardRingTimer = null;

    // ★ 음악 정지
    if (bgMusic) {
      bgMusic.pause();
      bgMusic.currentTime = 0;
    }
  }

  function endGame() {
    stopGame();
    document.getElementById('endStats').innerHTML =
      `총 운동 시간: 5분<br>수행한 동작: ${totalCards}개`;
    showScreen('endScreen');
  }

  // ── 페이지 로드 시 음원 초기화 ──
  initMusic();
</script>

</body>
