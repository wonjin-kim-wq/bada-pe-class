<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 술래 뽑기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red: #ff1744;
    --red-glow: #ff174488;
    --blue: #2979ff;
    --blue-glow: #2979ff88;
    --dark: #0a0a0f;
    --darker: #050508;
    --card-bg: #12121a;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--dark);
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ── 배경 파티클 ── */
  .bg-particles {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .bg-particles span {
    position: absolute; display: block; width: 4px; height: 4px;
    background: var(--red); border-radius: 50%; opacity: 0;
    animation: floatUp 6s infinite;
  }
  .bg-particles span:nth-child(even) { background: var(--blue); }
  @keyframes floatUp {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    20%  { opacity: 0.6; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* ── 메인 컨테이너 ── */
  .container {
    position: relative; z-index: 1;
    max-width: 800px; margin: 0 auto; padding: 30px 20px; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }

  /* ── 타이틀 ── */
  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem; font-weight: 900;
    text-align: center; margin: 30px 0 10px;
    background: linear-gradient(135deg, var(--red), var(--blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    animation: titlePulse 3s ease-in-out infinite alternate;
    letter-spacing: 2px;
  }
  @keyframes titlePulse {
    0%   { filter: brightness(1) drop-shadow(0 0 10px var(--red-glow)); }
    100% { filter: brightness(1.3) drop-shadow(0 0 25px var(--blue-glow)); }
  }
  .subtitle {
    font-size: 1rem; color: #888; text-align: center; margin-bottom: 40px;
    letter-spacing: 4px; text-transform: uppercase;
  }

  /* ── 입력 패널 ── */
  .input-panel {
    background: linear-gradient(145deg, #12121a, #1a1a28);
    border: 1px solid #2a2a3a;
    border-radius: 20px; padding: 40px;
    width: 100%; max-width: 700px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .inputs-row {
    display: flex;
    gap: 30px;
    margin-bottom: 30px;
  }
  .input-group {
    flex: 1;
  }
  .input-group label {
    display: block; font-size: 0.95rem; color: #aaa;
    margin-bottom: 12px; font-weight: 700; letter-spacing: 1px;
  }
  .input-group label .icon { font-size: 1.2rem; margin-right: 6px; }

  .number-control {
    display: flex; align-items: center; gap: 0;
    background: #0d0d14;
    border: 2px solid #2a2a3a;
    border-radius: 14px; overflow: hidden;
    transition: border-color 0.3s;
  }
  .number-control:focus-within {
    border-color: var(--blue);
    box-shadow: 0 0 15px var(--blue-glow);
  }
  .number-control.red:focus-within {
    border-color: var(--red);
    box-shadow: 0 0 15px var(--red-glow);
  }

  .num-btn {
    width: 56px; height: 56px; border: none;
    background: transparent; color: #fff; font-size: 1.5rem;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .num-btn:hover { background: rgba(255,255,255,0.08); }
  .num-btn:active { transform: scale(0.9); }
  .num-btn.minus { color: var(--red); }
  .num-btn.plus  { color: var(--blue); }

  .num-input {
    flex: 1; text-align: center;
    background: transparent; border: none; outline: none;
    color: #fff; font-size: 1.6rem; font-weight: 900;
    font-family: 'Orbitron', sans-serif;
    -moz-appearance: textfield;
  }
  
  .num-input::-webkit-outer-spin-button,
  .num-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* ── 시작 버튼 ── */
  .start-btn {
    width: 100%; padding: 18px; margin-top: 10px;
    font-size: 1.3rem; font-weight: 900; font-family: 'Noto Sans KR', sans-serif;
    color: #fff; border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, var(--red), #d50000, var(--red));
    background-size: 200% 200%;
    animation: gradShift 3s ease infinite;
    box-shadow: 0 4px 25px var(--red-glow);
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 3px;
    position: relative; overflow: hidden;
  }
  .start-btn::before {
    content: ''; position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: rotate(45deg); transition: 0.5s;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 35px var(--red-glow); }
  .start-btn:hover::before { left: 100%; }
  .start-btn:active { transform: scale(0.97); }
  @keyframes gradShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* ── 홈 링크 ── */
  .home-link {
    margin-top: 30px;
    color: #888;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: color 0.3s;
    border-bottom: 2px solid transparent;
    padding-bottom: 2px;
  }
  .home-link:hover {
    color: #ccc;
    border-bottom: 2px solid #ccc;
  }

  /* ── 선택 화면 ── */
  .selection-screen { display: none; width: 100%; text-align: center; }
  .selection-screen.active { display: block; }

  .student-grid {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 12px; margin: 30px 0; padding: 0 10px;
  }
  .student-card {
    width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card-bg);
    border: 2px solid #2a2a3a;
    border-radius: 12px; font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem; font-weight: 700; color: #555;
    transition: all 0.15s; position: relative; overflow: hidden;
    cursor: pointer;
    user-select: none;
  }
  .student-card.highlight {
    border-color: var(--blue);
    color: #fff;
    background: linear-gradient(135deg, #1a1a3a, #0d0d2a);
    box-shadow: 0 0 20px var(--blue-glow);
    transform: scale(1.1);
    z-index: 2;
  }
  .student-card.selected {
    border-color: var(--red) !important;
    color: #fff !important;
    background: linear-gradient(135deg, #3a0a0a, #2a0505) !important;
    box-shadow: 0 0 30px var(--red-glow), 0 0 60px rgba(255,23,68,0.3) !important;
    transform: scale(1.15) !important;
    animation: selectedPulse 0.8s ease-in-out infinite alternate;
    cursor: default;
  }
  @keyframes selectedPulse {
    0%   { box-shadow: 0 0 20px var(--red-glow); }
    100% { box-shadow: 0 0 40px var(--red-glow), 0 0 80px rgba(255,23,68,0.2); }
  }
  .student-card.eliminated {
    opacity: 0.15; transform: scale(0.85);
    border-color: #1a1a1a;
  }
  .student-card.excluded {
    opacity: 0.2;
    transform: scale(0.85);
    border-color: #333;
    background: #0a0a0f;
    color: #333;
    text-decoration: line-through;
    cursor: pointer;
  }
  .student-card.excluded:hover {
    opacity: 0.35;
    border-color: #555;
  }

  /* ── 제외 안내 ── */
  .exclude-hint {
    color: #555;
    font-size: 0.85rem;
    margin-top: -15px;
    margin-bottom: 15px;
    letter-spacing: 1px;
  }

  /* ── 결과 영역 ── */
  .result-area {
    margin-top: 20px; padding: 30px;
    background: linear-gradient(145deg, #12121a, #1a1a28);
    border: 2px solid var(--red);
    border-radius: 20px; display: none;
    box-shadow: 0 0 40px var(--red-glow);
    animation: resultAppear 0.5s ease-out;
  }
  @keyframes resultAppear {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .result-title {
    font-size: 1.6rem; font-weight: 900;
    color: var(--red); margin-bottom: 15px;
    text-shadow: 0 0 20px var(--red-glow);
  }
  .result-numbers {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.5rem; font-weight: 900;
    color: #fff; letter-spacing: 5px;
  }

  .btn-group { display: flex; gap: 12px; justify-content: center; margin-top: 25px; flex-wrap: wrap; }
  .action-btn {
    padding: 14px 32px; border: 2px solid; border-radius: 12px;
    font-size: 1rem; font-weight: 700; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.3s; background: transparent;
  }
  .action-btn.continue {
    color: #00e676; border-color: #00e676;
  }
  .action-btn.continue:hover {
    background: #00e676; color: #000;
    box-shadow: 0 0 20px rgba(0,230,118,0.5);
  }
  .action-btn.retry {
    color: var(--blue); border-color: var(--blue);
  }
  .action-btn.retry:hover {
    background: var(--blue); color: #fff;
    box-shadow: 0 0 20px var(--blue-glow);
  }
  .action-btn.reset {
    color: #888; border-color: #444;
  }
  .action-btn.reset:hover {
    background: #333; color: #fff;
  }

  /* ── 스캔라인 오버레이 ── */
  .scanline {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
    );
  }

  /* ── 중앙 플래시 ── */
  .flash-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 998;
    opacity: 0; transition: opacity 0.1s;
  }
  .flash-overlay.red { background: radial-gradient(circle, var(--red-glow), transparent 70%); }
  .flash-overlay.blue { background: radial-gradient(circle, var(--blue-glow), transparent 70%); }
  .flash-overlay.active { opacity: 1; }

  /* ── 카운트다운 ── */
  .countdown-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85); z-index: 100;
  }
  .countdown-overlay.active { display: flex; }
  .countdown-number {
    font-family: 'Orbitron', sans-serif;
    font-size: 10rem; font-weight: 900;
    color: var(--red);
    text-shadow: 0 0 60px var(--red-glow), 0 0 120px var(--red-glow);
    animation: countPop 0.8s ease-out;
  }
  @keyframes countPop {
    0%   { transform: scale(3); opacity: 0; }
    50%  { transform: scale(0.9); opacity: 1; }
    70%  { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 500px) {
    .title { font-size: 1.8rem; }
    .input-panel { padding: 25px; }
    .inputs-row { flex-direction: column; gap: 20px; margin-bottom: 20px; }
    .student-card { width: 50px; height: 50px; font-size: 0.9rem; }
    .result-numbers { font-size: 1.8rem; }
    .countdown-number { font-size: 6rem; }
  }
</style>
</head>
<body>

<div class="bg-particles" id="bgParticles"></div>
<div class="scanline"></div>
<div class="flash-overlay" id="flash"></div>
<div class="countdown-overlay" id="countdownOverlay">
  <div class="countdown-number" id="countdownNum"></div>
</div>

<div class="container">
  <div id="inputScreen">
    <div class="title">술래뽑기</div>
    <div class="subtitle">운명의 술래를 결정하라</div>

    <div class="input-panel">
      <div class="inputs-row">
        <div class="input-group">
          <label><span class="icon">👥</span> 전체 인원</label>
          <div class="number-control">
            <button class="num-btn minus" onclick="adjustNum('students', -1)">−</button>
            <input class="num-input" type="number" id="students" value="30" min="2" max="99"
                   oninput="validateInput()">
            <button class="num-btn plus" onclick="adjustNum('students', 1)">＋</button>
          </div>
        </div>
        <div class="input-group">
          <label><span class="icon">🎯</span> 술래 수</label>
          <div class="number-control red">
            <button class="num-btn minus" onclick="adjustNum('tagged', -1)">−</button>
            <input class="num-input" type="number" id="tagged" value="1" min="1" max="50"
                   oninput="validateInput()">
            <button class="num-btn plus" onclick="adjustNum('tagged', 1)">＋</button>
          </div>
        </div>
      </div>
      <button class="start-btn" id="startBtn" onclick="startSelection()">
        🎯 뽑기 시작
      </button>
    </div>

    <div style="text-align: center; margin-top: 30px;">
        <span class="home-link" onclick="window.location.href='../index.html'">홈으로 돌아가기</span>
    </div>
  </div>

  <div id="selectionScreen" class="selection-screen">
    <div class="title" id="selectionTitle" style="font-size:2rem; margin-bottom:5px;">READY</div>
    <div id="statusText" class="subtitle" style="margin-bottom:15px;">제외할 번호를 클릭한 후 시작하세요</div>

    <div class="exclude-hint" id="excludeHint">💡 카드를 클릭하면 제외할 수 있습니다</div>
    <div class="student-grid" id="studentGrid"></div>

    <button class="start-btn" id="goBtn" onclick="beginDraw()" style="max-width:700px; width:100%; margin-top:10px;">
      🎯 뽑기 시작
    </button>

    <div class="result-area" id="resultArea">
      <div class="result-title">🔥 술래 확정 🔥</div>
      <div class="result-numbers" id="resultNumbers"></div>
      <div class="btn-group">
        <button class="action-btn continue" onclick="continueSelection()">➕ 이어서 뽑기</button>
        <button class="action-btn retry" onclick="retrySelection()">🔄 처음부터 뽑기</button>
        <button class="action-btn reset" onclick="goBack()">⬅ 처음으로</button>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════ 사운드 엔진 (Web Audio API) ══════════════
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTick(freq = 600, dur = 0.06) {
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  g.gain.setValueAtTime(0.12, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

function playReveal() {
  ensureAudio();
  const now = audioCtx.currentTime;
  [523, 659, 784, 1047].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(f, now + i * 0.12);
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.15, now + i * 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now + i * 0.12); o.stop(now + i * 0.12 + 0.3);
  });
}

function playAlarm() {
  ensureAudio();
  const now = audioCtx.currentTime;
  for (let i = 0; i < 6; i++) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(i % 2 === 0 ? 880 : 660, now + i * 0.15);
    g.gain.setValueAtTime(0.1, now + i * 0.15);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.14);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now + i * 0.15); o.stop(now + i * 0.15 + 0.14);
  }
}

function playCountSound() {
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(220, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.4);
  g.gain.setValueAtTime(0.3, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.4);
}

function playDrumRoll(duration) {
  ensureAudio();
  const now = audioCtx.currentTime;
  const hits = Math.floor(duration / 0.05);
  for (let i = 0; i < hits; i++) {
    const t = now + i * 0.05;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'triangle';
    const vol = 0.03 + (i / hits) * 0.1;
    o.frequency.setValueAtTime(200 + Math.random() * 100, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.04);
  }
}

// ══════════════ 배경 파티클 ══════════════
(function initParticles() {
  const c = document.getElementById('bgParticles');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 6 + 's';
    s.style.animationDuration = (4 + Math.random() * 4) + 's';
    s.style.width = s.style.height = (2 + Math.random() * 4) + 'px';
    c.appendChild(s);
  }
})();

// ══════════════ 입력 제어 ══════════════
function adjustNum(id, delta) {
  const inp = document.getElementById(id);
  let v = parseInt(inp.value) || 0;
  v += delta;
  v = Math.max(parseInt(inp.min), Math.min(parseInt(inp.max), v));
  inp.value = v;
  playTick(delta > 0 ? 800 : 400, 0.04);
  validateInput();
}

function validateInput() {
  const s = parseInt(document.getElementById('students').value) || 0;
  const t = parseInt(document.getElementById('tagged').value) || 0;
  const btn = document.getElementById('startBtn');
  btn.disabled = (s < 2 || t < 1 || t >= s);
  btn.style.opacity = btn.disabled ? '0.4' : '1';
}

// ══════════════ 플래시 효과 ══════════════
function flash(color) {
  const el = document.getElementById('flash');
  el.className = 'flash-overlay ' + color + ' active';
  setTimeout(() => el.classList.remove('active'), 120);
}

// ══════════════ 균등 확률 생성기 ══════════════
function getFairRandom(max) {
  const array = new Uint32Array(1);
  window.crypto.getRandomValues(array);
  return array[0] % max;
}

// ══════════════ 메인 로직 ══════════════
let totalStudents = 0;
let totalTagged = 0;
let selectedNumbers = [];
let excludedNumbers = [];
let isRunning = false;

function toggleExclude(num) {
  if (isRunning) return;
  if (selectedNumbers.includes(num)) return;
  const card = document.getElementById('card-' + num);
  if (excludedNumbers.includes(num)) {
    excludedNumbers = excludedNumbers.filter(n => n !== num);
    card.classList.remove('excluded');
  } else {
    excludedNumbers.push(num);
    card.classList.add('excluded');
    card.classList.remove('eliminated');
    playTick(300, 0.04);
  }
}

function startSelection() {
  totalStudents = parseInt(document.getElementById('students').value);
  totalTagged = parseInt(document.getElementById('tagged').value);
  if (totalStudents < 2 || totalTagged < 1 || totalTagged >= totalStudents) return;

  ensureAudio();
  selectedNumbers = [];
  excludedNumbers = [];
  document.getElementById('inputScreen').style.display = 'none';
  const screen = document.getElementById('selectionScreen');
  screen.classList.add('active');
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('excludeHint').style.display = '';
  document.getElementById('goBtn').style.display = '';
  document.getElementById('selectionTitle').textContent = 'READY';
  document.getElementById('statusText').textContent = '제외할 번호를 클릭한 후 시작하세요';

  const grid = document.getElementById('studentGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= totalStudents; i++) {
    const card = document.createElement('div');
    card.className = 'student-card';
    card.id = 'card-' + i;
    card.textContent = i;
    card.onclick = () => toggleExclude(i);
    grid.appendChild(card);
  }
}

function beginDraw() {
  if (isRunning) return;
  document.getElementById('goBtn').style.display = 'none';
  document.getElementById('selectionTitle').textContent = 'SELECTING...';
  document.getElementById('statusText').textContent = '운명이 결정되는 중...';
  runCountdown().then(() => runSelectionAnimation());
}

function runCountdown() {
  return new Promise(resolve => {
    const overlay = document.getElementById('countdownOverlay');
    const numEl = document.getElementById('countdownNum');
    overlay.classList.add('active');
    let count = 3;

    function tick() {
      if (count === 0) {
        numEl.textContent = 'GO!';
        numEl.style.color = 'var(--blue)';
        playReveal();
        flash('blue');
        setTimeout(() => {
          overlay.classList.remove('active');
          numEl.style.color = 'var(--red)';
          resolve();
        }, 600);
        return;
      }
      numEl.textContent = count;
      numEl.style.animation = 'none';
      void numEl.offsetWidth;
      numEl.style.animation = 'countPop 0.8s ease-out';
      playCountSound();
      flash('red');
      count--;
      setTimeout(tick, 900);
    }
    tick();
  });
}

async function runSelectionAnimation() {
  isRunning = true;
  const statusText = document.getElementById('statusText');
  document.getElementById('excludeHint').style.display = 'none';

  let candidates = [];
  for (let i = 1; i <= totalStudents; i++) {
    if (!selectedNumbers.includes(i) && !excludedNumbers.includes(i)) {
      candidates.push(i);
    }
  }

  if (candidates.length < totalTagged) {
    statusText.textContent = '뽑을 수 있는 인원이 부족합니다!';
    isRunning = false;
    document.getElementById('excludeHint').style.display = '';
    return;
  }

  const newSelected = [];

  for (let round = 0; round < totalTagged; round++) {
    statusText.textContent = `술래 ${selectedNumbers.length + round + 1} 탐색 중...`;

    const totalTicks = 30 + Math.floor(Math.random() * 15);
    let delay = 40;

    playDrumRoll(totalTicks * 0.06);

    for (let t = 0; t < totalTicks; t++) {
      await sleep(delay);
      if (t > totalTicks * 0.5) delay += 8;
      if (t > totalTicks * 0.75) delay += 15;
      if (t > totalTicks * 0.9) delay += 25;

      clearHighlights();
      const rIdx = getFairRandom(candidates.length);
      const num = candidates[rIdx];
      const card = document.getElementById('card-' + num);
      if (card) card.classList.add('highlight');
      playTick(400 + Math.random() * 600, 0.04);
    }

    await sleep(200);
    clearHighlights();

    const chosen = candidates.splice(getFairRandom(candidates.length), 1)[0];
    newSelected.push(chosen);
    selectedNumbers.push(chosen);

    const card = document.getElementById('card-' + chosen);
    card.classList.add('selected');

    playAlarm();
    flash('red');
    await sleep(200);
    flash('red');

    for (let i = 1; i <= totalStudents; i++) {
      if (!selectedNumbers.includes(i) && !excludedNumbers.includes(i)) {
        document.getElementById('card-' + i).classList.add('eliminated');
      }
    }
    await sleep(800);
    for (let i = 1; i <= totalStudents; i++) {
      if (!selectedNumbers.includes(i) && !excludedNumbers.includes(i)) {
        document.getElementById('card-' + i).classList.remove('eliminated');
      }
    }
    await sleep(400);
  }

  statusText.textContent = '술래가 결정되었습니다!';
  for (let i = 1; i <= totalStudents; i++) {
    if (!selectedNumbers.includes(i) && !excludedNumbers.includes(i)) {
      document.getElementById('card-' + i).classList.add('eliminated');
    }
  }

  await sleep(500);
  playReveal();
  const resultArea = document.getElementById('resultArea');
  resultArea.style.display = 'block';
  document.getElementById('resultNumbers').textContent = selectedNumbers.slice().sort((a,b)=>a-b).join('  ');

  // 이어서 뽑기 가능 여부 체크
  const remaining = [];
  for (let i = 1; i <= totalStudents; i++) {
    if (!selectedNumbers.includes(i) && !excludedNumbers.includes(i)) remaining.push(i);
  }
  const continueBtn = document.querySelector('.action-btn.continue');
  if (remaining.length < 1) {
    continueBtn.style.opacity = '0.3';
    continueBtn.style.pointerEvents = 'none';
  } else {
    continueBtn.style.opacity = '1';
    continueBtn.style.pointerEvents = 'auto';
  }

  isRunning = false;
}

function clearHighlights() {
  document.querySelectorAll('.student-card.highlight').forEach(c => c.classList.remove('highlight'));
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function continueSelection() {
  if (isRunning) return;
  document.getElementById('resultArea').style.display = 'none';

  // 선택된 카드는 selected 상태 유지, 나머지 eliminated 해제
  for (let i = 1; i <= totalStudents; i++) {
    const c = document.getElementById('card-' + i);
    if (!selectedNumbers.includes(i) && !excludedNumbers.includes(i)) {
      c.classList.remove('eliminated');
    }
  }

  document.getElementById('excludeHint').style.display = '';
  document.getElementById('goBtn').style.display = '';
  document.getElementById('selectionTitle').textContent = 'READY';
  document.getElementById('statusText').textContent = '제외할 번호를 클릭한 후 시작하세요';
}

function retrySelection() {
  if (isRunning) return;
  selectedNumbers = [];
  excludedNumbers = [];
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('excludeHint').style.display = '';
  document.getElementById('goBtn').style.display = '';
  document.getElementById('selectionTitle').textContent = 'READY';
  document.getElementById('statusText').textContent = '제외할 번호를 클릭한 후 시작하세요';
  for (let i = 1; i <= totalStudents; i++) {
    const c = document.getElementById('card-' + i);
    c.className = 'student-card';
  }
}

function goBack() {
  if (isRunning) return;
  selectedNumbers = [];
  excludedNumbers = [];
  document.getElementById('selectionScreen').classList.remove('active');
  document.getElementById('inputScreen').style.display = '';
}

validateInput();
</script>
